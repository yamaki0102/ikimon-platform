name: Setup platform_v2 browser smoke runtime
description: Install Node, platform_v2 dependencies, and the Chromium browser used by Playwright smoke tests.

inputs:
  node-version:
    description: Node.js version used by platform_v2.
    required: false
    default: "22"
  working-directory:
    description: platform_v2 package directory.
    required: false
    default: platform_v2
  cache-dependency-path:
    description: npm lockfile path for dependency caching.
    required: false
    default: platform_v2/package-lock.json
  install-with-deps:
    description: Install browser OS dependencies with Playwright.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install platform_v2 dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Configure Playwright browser cache path
      shell: bash
      run: |
        set -euo pipefail
        echo "PLAYWRIGHT_BROWSERS_PATH=${GITHUB_WORKSPACE}/.cache/ms-playwright" >> "$GITHUB_ENV"

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Playwright version: ${version}"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.cache/ms-playwright
        key: platform-v2-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
        restore-keys: |
          platform-v2-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-

    - name: Install Playwright Chromium
      if: ${{ inputs.install-with-deps == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Install Playwright Chromium without OS deps
      if: ${{ inputs.install-with-deps != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install chromium

name: Diagnose July Asset Predicate Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-july-record-pairing-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - run: npm --prefix platform_v2/cloudflare_shadow ci
      - name: Query exact predicate inputs
        working-directory: platform_v2/cloudflare_shadow
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/july-asset-predicate"
          mkdir -p "$root"
          npx wrangler d1 execute ikimon_prod_core --env production --remote --json \
            --command "SELECT user_id FROM auth_users WHERE lower(email)=lower('yamaki0102@gmail.com') LIMIT 1" > "$root/account.raw.json"
          USER_ID="$(node -e "const r=require(process.argv[1]);process.stdout.write(r[0].results[0].user_id)" "$root/account.raw.json")"
          npx wrangler d1 execute ikimon_prod_observations_2026_06 --env production --remote --json \
            --command "SELECT o.observation_id,o.observed_at,a.asset_id,a.processing_state,a.public_derivative_key,a.public_derivative_verified_at,a.public_derivative_metadata_json,a.exif_scrub_state,a.mime,a.width,a.height,a.bytes,a.public_ready_at,a.uploaded_at FROM observations o LEFT JOIN asset_ledger a ON a.observation_id=o.observation_id WHERE o.owner_user_id='$USER_ID' AND substr(o.observed_at,1,10) IN ('2026-07-07','2026-07-10') ORDER BY o.observed_at DESC,a.created_at" > "$root/assets.raw.json"
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const cp=require('node:child_process');
          const root=process.env.GITHUB_WORKSPACE+'/july-asset-predicate';
          const rows=JSON.parse(fs.readFileSync(root+'/assets.raw.json','utf8'))[0]?.results??[];
          const hash=(v)=>crypto.createHash('sha256').update(String(v??'')).digest('hex').slice(0,12);
          const reportRows=[];
          for(const row of rows){
            let metadata=null;
            try{metadata=row.public_derivative_metadata_json?JSON.parse(row.public_derivative_metadata_json):null;}catch{}
            const publicPath=row.public_derivative_key?'/'+String(row.public_derivative_key).replace(/^\/+/, ''):null;
            let httpStatus=null;
            if(publicPath){
              try{httpStatus=Number(cp.execFileSync('curl',['-sS','-L','--connect-timeout','10','--max-time','30','-o','/dev/null','-w','%{http_code}','https://ikimon.life'+publicPath],{encoding:'utf8'}).trim());}catch(e){httpStatus=Number(String(e.stdout||'0').trim())||0;}
            }
            const uploaded=row.processing_state==='uploaded';
            const hasKey=Boolean(row.public_derivative_key);
            const verified=Boolean(row.public_derivative_verified_at);
            const metadataPresent=Boolean(row.public_derivative_metadata_json);
            const notSvgContainer=!String(row.public_derivative_metadata_json??'').includes('"scannedContainer":"svg+xml"');
            const notSvgContent=!String(row.public_derivative_metadata_json??'').includes('"contentType":"image/svg');
            const scrubbed=row.exif_scrub_state==='scrubbed';
            const imageMime=String(row.mime??'').startsWith('image/');
            const placeholder=Number(row.width||0)===320&&Number(row.height||0)===240&&Number(row.bytes||0)>0&&Number(row.bytes||0)<=12000;
            const onePixel=Number(row.width||0)===1&&Number(row.height||0)===1;
            reportRows.push({
              observationHash:hash(row.observation_id),assetHash:hash(row.asset_id),observedAt:row.observed_at,
              uploaded,hasKey,verified,metadataPresent,metadataLength:String(row.public_derivative_metadata_json??'').length,
              metadataKeys:metadata&&typeof metadata==='object'?Object.keys(metadata).sort():[],
              metadataContentType:metadata?.contentType??null,metadataScannedContainer:metadata?.scannedContainer??null,
              scrubbed,imageMime,mime:row.mime??null,width:Number(row.width||0),height:Number(row.height||0),bytes:Number(row.bytes||0),
              publicReady:Boolean(row.public_ready_at),uploadedAt:Boolean(row.uploaded_at),notSvgContainer,notSvgContent,placeholder,onePixel,
              exactOwnerPhotoPredicate:uploaded&&hasKey&&verified&&metadataPresent&&notSvgContainer&&notSvgContent&&scrubbed&&imageMime&&!placeholder&&!onePixel,
              publicUrlStatus:httpStatus,
            });
          }
          fs.writeFileSync(root+'/report.json',JSON.stringify({mode:'read-only',rows:reportRows,rawIdentifiersIncluded:false,productionMutated:false},null,2));
          fs.rmSync(root+'/assets.raw.json');
          fs.rmSync(root+'/account.raw.json');
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: july-asset-predicate
          path: july-asset-predicate/report.json
          if-no-files-found: error
          retention-days: 5

name: Ai Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  apply-record-recovery-origin-fix:
    name: Apply Record Recovery Origin Fix
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1283 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-record-recovery-origin-route-20260712
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json

      - name: Apply exact recovery origin route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('platform_v2/cloudflare_shadow/src/index.ts')
          source = path.read_text(encoding='utf-8')
          old_route = '''      if ((request.method === "GET" || request.method === "HEAD") && isRecordHtmlPath(url.pathname)) {
        return getSessionAwareRecordHtml(request, url, env);
      }'''
          new_route = '''      if ((request.method === "GET" || request.method === "HEAD") && isRecordHtmlPath(url.pathname)) {
        if (isRecordRecoveryRequest(url) && env.ORIGIN_FALLBACK_BASE_URL) {
          return fetchOriginFallback(request, url, env, "record_recovery");
        }
        return getSessionAwareRecordHtml(request, url, env);
      }'''
          if old_route in source:
              source = source.replace(old_route, new_route, 1)
          elif new_route not in source:
              raise SystemExit('record route block not found')
          old_helper = '''function isRecordHtmlPath(pathname: string): boolean {
  return /^(?:\\/(?:ja|en|es|pt-br))?\\/record$/.test(pathname);
}'''
          new_helper = '''function isRecordHtmlPath(pathname: string): boolean {
  return /^(?:\\/(?:ja|en|es|pt-br))?\\/record$/.test(pathname);
}

const RECORD_RECOVERY_SOURCE_VALUES = new Set([
  "location_denied",
  "login_required",
  "draft_restore",
  "media_retry",
  "upload_failed",
  "global_capture"
]);

function isRecordRecoveryRequest(url: URL): boolean {
  if (!isRecordHtmlPath(url.pathname)) return false;
  if (url.searchParams.get("draft") === "1") return true;
  if (url.searchParams.get("retry") === "media") return true;
  const source = url.searchParams.get("source")?.trim() ?? "";
  return RECORD_RECOVERY_SOURCE_VALUES.has(source);
}'''
          if old_helper in source:
              source = source.replace(old_helper, new_helper, 1)
          elif new_helper not in source:
              raise SystemExit('record helper block not found')
          path.write_text(source, encoding='utf-8')
          PY

          cat > platform_v2/cloudflare_shadow/src/recordRecoveryOriginRoute.test.ts <<'TEST'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync(new URL("./index.ts", import.meta.url), "utf8");

          test("record recovery requests use exact origin fallback before native or materialized record HTML", () => {
            assert.match(source, /const RECORD_RECOVERY_SOURCE_VALUES = new Set\(\[/);
            for (const value of ["location_denied", "login_required", "draft_restore", "media_retry", "upload_failed", "global_capture"]) {
              assert.match(source, new RegExp(`"${value}"`));
            }
            assert.match(source, /function isRecordRecoveryRequest\(url: URL\): boolean/);
            assert.match(source, /url\.searchParams\.get\("draft"\) === "1"/);
            assert.match(source, /url\.searchParams\.get\("retry"\) === "media"/);
            assert.match(source, /isRecordRecoveryRequest\(url\) && env\.ORIGIN_FALLBACK_BASE_URL/);
            assert.match(source, /fetchOriginFallback\(request, url, env, "record_recovery"\)/);
            assert.match(source, /fetchOriginFallback[\s\S]{0,220}getSessionAwareRecordHtml/);
          });
          TEST
          rm -f .github/workflows/apply-record-recovery-origin-route.yml
          git diff --check

      - name: Verify Cloudflare Worker
        working-directory: platform_v2/cloudflare_shadow
        run: |
          npm ci
          npm run check
          npm run test:quick

      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: route record recovery through origin fallback'
          git push origin HEAD:agent/fix-record-recovery-origin-route-20260712

  ai-review-gate:
    name: Ai Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR merge readiness
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("pr_number"))
              : context.payload.pull_request?.number;

            if (!prNumber) {
              core.setFailed("No pull request number was provided.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const failures = [];
            const warnings = [];
            const body = pr.body || "";
            const labels = (pr.labels || []).map((label) => label.name);

            if (pr.base.ref !== "main") {
              failures.push(`Base branch must be main, got ${pr.base.ref}.`);
            }

            if (pr.draft) {
              warnings.push("PR is draft. GitHub blocks merge until ready_for_review; risk checks still run.");
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const forbiddenPatterns = [
              /(^|\/)\.env($|[./])/,
              /credentials\.json$/,
              /\.sqlite$/,
              /\.db$/,
              /(^|\/)upload_package\/data\//,
              /(^|\/)\.git\//,
            ];

            const forbiddenFiles = files
              .map((file) => file.filename)
              .filter((filename) => forbiddenPatterns.some((pattern) => pattern.test(filename)));

            if (forbiddenFiles.length > 0) {
              failures.push(`Forbidden files changed: ${forbiddenFiles.join(", ")}`);
            }

            const sensitivePatterns = [
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^ops\/deploy\//,
              /^ops\/nginx\//,
              /^platform_v2\/db\/migrations\//,
              /^scripts\/check_(deploy_guardrails|deploy_manifest_sync|platform_migration_guardrails|staging_manifest_sync)\.ps1$/,
            ];
            const sensitiveFiles = files
              .map((file) => file.filename)
              .filter((filename) => sensitivePatterns.some((pattern) => pattern.test(filename)));

            const hasImpactSection = /影響範囲|impact/i.test(body);
            const hasVerificationSection = /検証|verification|tests?/i.test(body);
            const hasReviewFocusSection = /review重点|review focus|review/i.test(body);

            if (sensitiveFiles.length > 0 && (!hasImpactSection || !hasVerificationSection)) {
              failures.push("Workflow/deploy/migration-sensitive changes require PR body impact and verification evidence.");
            }

            if (files.length > 50 && !hasReviewFocusSection && !labels.includes("ai-reviewed-broad-scope")) {
              failures.push("PR changes more than 50 files and needs review focus evidence or the ai-reviewed-broad-scope label.");
            }

            const reviewThreadQuery = `
              query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100, after:$cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { isResolved }
                    }
                  }
                }
              }
            `;
            let unresolvedThreads = 0;
            let cursor = null;
            do {
              const result = await github.graphql(reviewThreadQuery, {
                owner,
                repo,
                number: prNumber,
                cursor,
              });
              const page = result.repository.pullRequest.reviewThreads;
              unresolvedThreads += page.nodes.filter((thread) => !thread.isResolved).length;
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            if (unresolvedThreads > 0) {
              failures.push(`PR has unresolved review threads: ${unresolvedThreads}.`);
            }

            if (!hasImpactSection) {
              warnings.push("PR body has no explicit impact section.");
            }
            if (!hasVerificationSection) {
              warnings.push("PR body has no explicit verification section.");
            }

            await core.summary
              .addHeading("Ai Review Gate")
              .addList([
                `PR: #${prNumber}`,
                `Head: ${pr.head.sha}`,
                `Draft: ${pr.draft}`,
                `Changed files: ${files.length}`,
                `Sensitive files: ${sensitiveFiles.length}`,
                `Unresolved review threads: ${unresolvedThreads}`,
              ])
              .addHeading("Failures", 2)
              .addList(failures.length > 0 ? failures : ["none"])
              .addHeading("Warnings", 2)
              .addList(warnings.length > 0 ? warnings : ["none"])
              .write();

            if (failures.length > 0) {
              core.setFailed(failures.join(" "));
            }

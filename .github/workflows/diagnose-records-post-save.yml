name: Diagnose Records Post Save Flow

on:
  push:
    branches:
      - agent/records-post-save-ux-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    if: github.head_ref == 'agent/records-post-save-ux-20260712' || github.ref_name == 'agent/records-post-save-ux-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/records-post-save-ux-20260712
          fetch-depth: 1
      - name: Collect focused sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p records-post-save-diagnostic/src/routes records-post-save-diagnostic/src/services records-post-save-diagnostic/src/ui records-post-save-diagnostic/e2e
          cp platform_v2/src/routes/read.ts records-post-save-diagnostic/src/routes/
          cp platform_v2/src/routes/publicEntryRead.ts records-post-save-diagnostic/src/routes/
          cp platform_v2/src/services/landingSnapshot.ts records-post-save-diagnostic/src/services/
          cp platform_v2/src/services/readModels.ts records-post-save-diagnostic/src/services/
          cp platform_v2/src/ui/landingTop.ts records-post-save-diagnostic/src/ui/
          cp platform_v2/src/ui/siteShell.ts records-post-save-diagnostic/src/ui/
          cp platform_v2/src/ui/observationCard.ts records-post-save-diagnostic/src/ui/
          cp platform_v2/src/routes/publicCopy.routes.test.ts records-post-save-diagnostic/src/routes/
          cp platform_v2/src/ui/landingTop.test.ts records-post-save-diagnostic/src/ui/
          cp platform_v2/src/ui/siteShell.test.ts records-post-save-diagnostic/src/ui/
          cp platform_v2/e2e/record-funnel.staging.spec.ts records-post-save-diagnostic/e2e/
          cp platform_v2/e2e/notes-map-regression.staging.spec.ts records-post-save-diagnostic/e2e/
          {
            echo '=== records route ==='
            rg -n -C 8 'app\.get\("/records"|app\.get\('\''/records' platform_v2/src/routes/read.ts || true
            echo '=== notes library functions ==='
            rg -n -C 5 'notesLibrary|renderNotes|view=mine|record_saved|recent_record|highlight' platform_v2/src/routes/read.ts platform_v2/src/ui/siteShell.ts platform_v2/src/ui/landingTop.ts platform_v2/src/services/landingSnapshot.ts || true
            echo '=== list/read model ==='
            rg -n -C 5 'getObservationListPage|getObservationListSnapshot|getLandingOwnFeedPage|myFeed|photoUrl|mediaUrl|hasPhoto' platform_v2/src/routes/read.ts platform_v2/src/services/readModels.ts platform_v2/src/services/landingSnapshot.ts || true
          } > records-post-save-diagnostic/grep-context.txt
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v6
        with:
          name: records-post-save-diagnostic
          path: records-post-save-diagnostic
          if-no-files-found: error
          retention-days: 7

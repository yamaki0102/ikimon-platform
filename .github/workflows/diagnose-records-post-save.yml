name: Apply Records Post Save UX

on:
  push:
    branches:
      - agent/records-post-save-ux-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-records-post-save-ux
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/records-post-save-ux-20260712' || github.ref_name == 'agent/records-post-save-ux-20260712')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/records-post-save-ux-20260712
          fetch-depth: 0

      - name: Apply focused records UX patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/records-post-save-patch/part*.b64 | base64 --decode > /tmp/records-post-save.patch
          git apply --check /tmp/records-post-save.patch
          git apply /tmp/records-post-save.patch

      - name: Verify platform contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2 run build
          npm --prefix platform_v2 run test:node

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/records-post-save-patch
          rm -f .github/workflows/diagnose-records-post-save.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform_v2/src/routes/read.ts platform_v2/src/routes/publicCopy.routes.test.ts platform_v2/e2e/record-funnel.staging.spec.ts .github/records-post-save-patch .github/workflows/diagnose-records-post-save.yml
          git commit -m 'feat: clarify saved records and records entry state'
          git push origin HEAD:agent/records-post-save-ux-20260712

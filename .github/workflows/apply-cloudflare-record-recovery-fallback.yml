name: Export Cloudflare Record Renderer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: export-cloudflare-record-renderer
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/cloudflare-record-recovery-origin-fallback-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cloudflare-record-recovery-origin-fallback-20260712
          fetch-depth: 1

      - name: Collect Worker record source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-record-renderer-source/platform_v2/cloudflare_shadow/src
          cp platform_v2/cloudflare_shadow/src/index.ts cloudflare-record-renderer-source/platform_v2/cloudflare_shadow/src/index.ts
          grep -nE -C 240 'function isRecordHtmlPath|async function getSessionAwareRecordHtml|function renderCloudflareRecordHtml' \
            platform_v2/cloudflare_shadow/src/index.ts \
            > cloudflare-record-renderer-source/record-renderer-context.txt
          grep -nE -C 100 'data-record|record-media|record-form|indexedDB|draft|file' \
            cloudflare-record-renderer-source/record-renderer-context.txt \
            > cloudflare-record-renderer-source/record-interaction-context.txt || true
          git rev-parse HEAD > cloudflare-record-renderer-source/head-sha.txt
          sha256sum platform_v2/cloudflare_shadow/src/index.ts > cloudflare-record-renderer-source/index-sha256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: cloudflare-record-renderer-source
          path: cloudflare-record-renderer-source
          if-no-files-found: error
          retention-days: 3

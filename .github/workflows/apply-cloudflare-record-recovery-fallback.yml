name: Apply Cloudflare Native Record Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-cloudflare-native-record-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/cloudflare-record-recovery-origin-fallback-20260712' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cloudflare-record-recovery-origin-fallback-20260712
          fetch-depth: 0

      - name: Materialize native recovery module and patch Worker routing
        shell: bash
        run: |
          set -euo pipefail
          cat <<'MODULE_B64' | base64 -d | gunzip > platform_v2/cloudflare_shadow/src/recordRecoveryHtml.ts

MODULE_B64
          cat <<'TEST_B64' | base64 -d | gunzip > platform_v2/cloudflare_shadow/src/recordRecoveryHtml.test.ts

TEST_B64
          python - <<'PY'
          from pathlib import Path

          path = Path('platform_v2/cloudflare_shadow/src/index.ts')
          source = path.read_text(encoding='utf-8')
          import_anchor = 'import * as bcrypt from "bcryptjs";\n'
          import_block = '''import * as bcrypt from "bcryptjs";
          import {
            renderCloudflareRecordRecoveryGuestHtml,
            renderCloudflareRecordRecoverySignedHtml,
            resolveCloudflareRecordRecoveryState
          } from "./recordRecoveryHtml";
          '''
          if 'from "./recordRecoveryHtml"' not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('bcrypt import anchor not found')
              source = source.replace(import_anchor, import_block, 1)

          old_handler = '''async function getSessionAwareRecordHtml(request: Request, url: URL, env: Env): Promise<Response> {
            const session = await readCompatibleSessionWithOriginFallback(request, env);
            if (!session || session.banned) {
              return getOriginalUiHtml(request, url, env);
            }

            const cspNonce = createHtmlCspNonce();
            const body = request.method === "HEAD"
              ? null
              : renderCloudflareRecordHtml(session, url, cspNonce);

            return new Response(body, {
              headers: {
                ...browserSecurityHeaders(cspNonce, env.ENVIRONMENT === "production"),
                "content-type": "text/html; charset=utf-8",
                "cache-control": "no-store",
                "vary": "cookie, authorization",
                "x-ikimon-cloudflare-native": "record-session"
              }
            });
          }'''
          new_handler = '''async function getSessionAwareRecordHtml(request: Request, url: URL, env: Env): Promise<Response> {
            const recovery = resolveCloudflareRecordRecoveryState(url);
            const session = await readCompatibleSessionWithOriginFallback(request, env);
            if (recovery.active) {
              const cspNonce = createHtmlCspNonce();
              const body = request.method === "HEAD"
                ? null
                : session && !session.banned
                  ? renderCloudflareRecordRecoverySignedHtml(session, url, cspNonce, recovery)
                  : renderCloudflareRecordRecoveryGuestHtml(url, cspNonce);
              return new Response(body, {
                headers: {
                  ...browserSecurityHeaders(cspNonce, env.ENVIRONMENT === "production"),
                  "content-type": "text/html; charset=utf-8",
                  "cache-control": "no-store",
                  "vary": "cookie, authorization",
                  "x-ikimon-cloudflare-native": session && !session.banned ? "record-recovery-session" : "record-recovery-guest",
                  ...releaseIdentityHeaders(env)
                }
              });
            }
            if (!session || session.banned) {
              return getOriginalUiHtml(request, url, env);
            }

            const cspNonce = createHtmlCspNonce();
            const body = request.method === "HEAD"
              ? null
              : renderCloudflareRecordHtml(session, url, cspNonce);

            return new Response(body, {
              headers: {
                ...browserSecurityHeaders(cspNonce, env.ENVIRONMENT === "production"),
                "content-type": "text/html; charset=utf-8",
                "cache-control": "no-store",
                "vary": "cookie, authorization",
                "x-ikimon-cloudflare-native": "record-session"
              }
            });
          }'''
          if new_handler not in source:
              if source.count(old_handler) != 1:
                  raise SystemExit(f'expected one session-aware record handler, found {source.count(old_handler)}')
              source = source.replace(old_handler, new_handler, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json

      - name: Verify native recovery
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2/cloudflare_shadow ci
          npm --prefix platform_v2/cloudflare_shadow run check
          npm --prefix platform_v2/cloudflare_shadow test

      - name: Commit native recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform_v2/cloudflare_shadow/src/index.ts \
            platform_v2/cloudflare_shadow/src/recordRecoveryHtml.ts \
            platform_v2/cloudflare_shadow/src/recordRecoveryHtml.test.ts
          git diff --cached --check
          git commit -m 'fix: serve record recovery natively on Cloudflare'
          git push origin HEAD:agent/cloudflare-record-recovery-origin-fallback-20260712

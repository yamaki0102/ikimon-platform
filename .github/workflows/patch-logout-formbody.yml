name: Patch Logout Form Body Support

on:
  push:
    branches:
      - agent/logout-csrf-confirmation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/logout-csrf-confirmation
          fetch-depth: 0
      - name: Add URL-encoded parser and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform_v2/src/routes/auth.ts')
          source = path.read_text(encoding='utf-8')
          marker = 'export async function registerAuthRoutes(app: FastifyInstance): Promise<void> {\n'
          parser = '''export async function registerAuthRoutes(app: FastifyInstance): Promise<void> {
            if (!app.hasContentTypeParser("application/x-www-form-urlencoded")) {
              app.addContentTypeParser(
                "application/x-www-form-urlencoded",
                { parseAs: "string" },
                (_request, body, done) => {
                  done(null, Object.fromEntries(new URLSearchParams(body)));
                },
              );
            }
          '''
          if 'application/x-www-form-urlencoded' not in source:
              if marker not in source:
                  raise SystemExit('registerAuthRoutes marker not found')
              source = source.replace(marker, parser, 1)
              path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/patch-logout-formbody.yml
      - name: Commit scoped patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform_v2/src/routes/auth.ts .github/workflows/patch-logout-formbody.yml
          git diff --cached --check
          git commit -m "fix: accept native logout form submissions"
          git push origin HEAD:agent/logout-csrf-confirmation

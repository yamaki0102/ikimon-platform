name: Inspect Final Production Deploy

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 8ae5ddc6db72ba1d7f9b882195e4c879898ac2be
    steps:
      - name: Print final deploy status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30" \
            > runs.json
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const payload = JSON.parse(fs.readFileSync('runs.json', 'utf8'));
          const run = (payload.workflow_runs || []).find((item) => item.head_sha === expected);
          if (!run) throw new Error(`deploy_run_not_found:${expected}`);
          console.log(JSON.stringify({ id: run.id, run_number: run.run_number, status: run.status, conclusion: run.conclusion, html_url: run.html_url, created_at: run.created_at, updated_at: run.updated_at }, null, 2));
          NODE

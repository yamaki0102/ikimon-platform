name: Diagnose Post Deploy Map Check

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_JOB_ID: '86496616554'
    steps:
      - name: Extract map verification failure
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            > full.log
          grep -n -E -C 20 'Map UI content check|Map UI|map-content|map content|grep|##\[error\]|Process completed with exit code' full.log || true
          tail -n 260 full.log

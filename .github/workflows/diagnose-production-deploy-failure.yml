name: Diagnose Latest Production Deploy Failure

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_JOB_ID: '86495304229'
    steps:
      - name: Extract latest deploy failure
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            > full.log
          grep -n -E -C 14 'production_execute|production_release|Fast deploy refused|failed with exit code|Smoke failed|Refusing deploy|Error:|##\[error\]' full.log || true
          tail -n 320 full.log

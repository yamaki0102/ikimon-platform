name: Apply Owner Home Product V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-owner-home-product-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform_v2/package-lock.json
            platform_v2/cloudflare_shadow/package-lock.json

      - name: Extract and run the reviewed product patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-home-product-v2-evidence
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-owner-home-fix-once.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY' 2>&1 | tee owner-home-apply-evidence/apply.log\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-owner-home.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-owner-home.py 2>&1 | tee owner-home-product-v2-evidence/apply.log
          echo "status=$(cat .owner-home-patch-status)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.patch.outputs.status == 'changed'
        run: |
          npm --prefix platform_v2 ci
          npm --prefix platform_v2/cloudflare_shadow ci

      - name: Verify product changes
        if: steps.patch.outputs.status == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          {
            npm --prefix platform_v2 run typecheck
            npm --prefix platform_v2/cloudflare_shadow run check
            (cd platform_v2 && npx tsx --test src/routes/pwa.routes.test.ts src/deployPwaVersionContract.test.ts)
            (cd platform_v2/cloudflare_shadow && npx tsx --test src/ownerHomeInjectionContract.test.ts)
            git diff --check
          } 2>&1 | tee owner-home-product-v2-evidence/verify.log

      - name: Commit verified product changes
        if: steps.patch.outputs.status == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .owner-home-patch-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_v2/cloudflare_shadow/src/index.ts \
                  platform_v2/cloudflare_shadow/src/index.test.ts \
                  platform_v2/cloudflare_shadow/src/ownerHomeInjectionContract.test.ts \
                  platform_v2/src/appInstall.ts \
                  platform_v2/src/deployPwaVersionContract.test.ts \
                  platform_v2/src/routes/pwa.routes.test.ts \
                  scripts/verify_cloudflare_production_release.sh
          git commit -m "fix: refresh and compact the real owner home"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Clean local marker
        if: always()
        run: rm -f .owner-home-patch-status

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owner-home-product-v2-evidence
          path: owner-home-product-v2-evidence
          if-no-files-found: error
          retention-days: 3

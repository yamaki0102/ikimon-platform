name: Rally Participant Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/worker-rally-auto-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage fake D1 source
        shell: bash
        run: |
          mkdir -p rally-participant-source
          cp platform_v2/cloudflare_shadow/src/index.test.ts rally-participant-source/index.test.ts
          cp platform_v2/cloudflare_shadow/src/index.ts rally-participant-source/index.ts
      - name: Upload diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: rally-participant-source
          path: rally-participant-source
          if-no-files-found: error

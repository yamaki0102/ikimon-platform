name: Rally Participant Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/worker-rally-auto-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Capture participant structure
        shell: bash
        run: |
          {
            echo '=== participant interfaces and maps ==='
            rg -n -C 5 "ObservationEventParticipant|observationEventParticipants" platform_v2/cloudflare_shadow/src/index.test.ts || true
            echo '=== active participant SQL handlers ==='
            rg -n -C 8 "observation_event_participants|participant_id" platform_v2/cloudflare_shadow/src/index.test.ts | head -n 240 || true
          } > rally-participant-structure.log
          cat rally-participant-structure.log
      - name: Upload diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: rally-participant-structure
          path: rally-participant-structure.log
          if-no-files-found: error

name: Verify Record Recovery Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-record-recovery-production
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.head_ref == 'agent/verify-record-recovery-production-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 67ea561c25b71860577eda13610b3bda55f9c35c
      PRODUCTION_BASE_URL: https://ikimon.life
    steps:
      - name: Capture exact production deployment and public responses
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const targetSha = process.env.TARGET_SHA;
            const baseUrl = process.env.PRODUCTION_BASE_URL.replace(/\/$/, '');
            const evidenceDir = 'record-recovery-production-evidence';
            fs.mkdirSync(evidenceDir, { recursive: true });

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              event: 'push',
              per_page: 30,
            });
            const run = response.data.workflow_runs.find((candidate) => candidate.head_sha === targetSha) || null;
            if (!run) throw new Error(`Production workflow run not found for ${targetSha}`);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const deployment = {
              targetSha,
              run: {
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                headSha: run.head_sha,
                headBranch: run.head_branch,
                event: run.event,
                htmlUrl: run.html_url,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                runAttempt: run.run_attempt,
              },
              jobs: jobs.map((job) => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                htmlUrl: job.html_url,
                startedAt: job.started_at,
                completedAt: job.completed_at,
                steps: (job.steps || []).map((step) => ({
                  name: step.name,
                  status: step.status,
                  conclusion: step.conclusion,
                  number: step.number,
                })),
              })),
            };
            fs.writeFileSync(path.join(evidenceDir, 'deployment.json'), JSON.stringify(deployment, null, 2));

            const routes = {
              'runtime-version': '/api/v1/runtime/version',
              health: '/healthz',
              'recovery-guest': '/ja/record?draft=1&start=photo&source=login_required',
              'record-normal': '/ja/record',
            };
            const publicResponses = {};
            for (const [name, route] of Object.entries(routes)) {
              try {
                const publicResponse = await fetch(`${baseUrl}${route}`, {
                  headers: { 'user-agent': 'ikimon-production-readonly-verifier/1.0' },
                  redirect: 'follow',
                });
                const body = await publicResponse.text();
                publicResponses[name] = {
                  status: publicResponse.status,
                  headers: Object.fromEntries(publicResponse.headers),
                  body,
                };
              } catch (error) {
                publicResponses[name] = { status: 0, headers: {}, body: String(error) };
              }
              fs.writeFileSync(
                path.join(evidenceDir, `${name}.json`),
                JSON.stringify(publicResponses[name], null, 2),
              );
            }

            const runtime = (() => {
              try { return JSON.parse(publicResponses['runtime-version'].body); } catch { return null; }
            })();
            const health = (() => {
              try { return JSON.parse(publicResponses.health.body); } catch { return null; }
            })();
            const recoveryBody = publicResponses['recovery-guest'].body || '';
            const normalBody = publicResponses['record-normal'].body || '';
            const verification = {
              targetSha,
              deploymentStatus: run.status,
              deploymentConclusion: run.conclusion,
              runtimeStatus: publicResponses['runtime-version'].status,
              runtimeGitSha: runtime?.gitSha ?? null,
              runtimeEnv: runtime?.runtimeEnv ?? null,
              builtAt: runtime?.builtAt ?? null,
              migrationHead: runtime?.migrationHead ?? null,
              healthStatus: publicResponses.health.status,
              healthOk: health?.ok === true,
              recoveryStatus: publicResponses['recovery-guest'].status,
              recoveryMarkers: {
                draftRetained: recoveryBody.includes('写真・入力内容はこの端末に残っています'),
                loginAction: recoveryBody.includes('ログインして続ける'),
                registerAction: recoveryBody.includes('登録して続ける'),
              },
              normalRecordStatus: publicResponses['record-normal'].status,
              normalRecordHtml: /<html/i.test(normalBody),
            };
            fs.writeFileSync(path.join(evidenceDir, 'public-verification.json'), JSON.stringify(verification, null, 2));

            if (run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`Production deployment is ${run.status}/${run.conclusion}`);
            }

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-recovery-production-evidence
          path: record-recovery-production-evidence
          if-no-files-found: error
          retention-days: 14

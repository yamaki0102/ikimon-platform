name: Verify Record Recovery Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-record-recovery-production
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.head_ref == 'agent/verify-record-recovery-production-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 67ea561c25b71860577eda13610b3bda55f9c35c
      PRODUCTION_BASE_URL: https://ikimon.life
    steps:
      - name: Wait for exact production deployment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const targetSha = process.env.TARGET_SHA;
            const baseUrl = process.env.PRODUCTION_BASE_URL.replace(/\/$/, '');
            const evidenceDir = 'record-recovery-production-evidence';
            fs.mkdirSync(evidenceDir, { recursive: true });

            let run = null;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy.yml',
                branch: 'main',
                event: 'push',
                per_page: 30,
              });
              run = response.data.workflow_runs.find((candidate) => candidate.head_sha === targetSha) || null;
              if (run?.status === 'completed') break;
              core.info(`Production attempt ${attempt}: ${run ? `${run.status}/${run.conclusion || 'pending'}` : 'not found'}`);
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            if (!run) throw new Error(`Production workflow run not found for ${targetSha}`);

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const deployment = {
              targetSha,
              run: {
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                headSha: run.head_sha,
                headBranch: run.head_branch,
                event: run.event,
                htmlUrl: run.html_url,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                runAttempt: run.run_attempt,
              },
              jobs: jobs.map((job) => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                htmlUrl: job.html_url,
                startedAt: job.started_at,
                completedAt: job.completed_at,
                steps: (job.steps || []).map((step) => ({
                  name: step.name,
                  status: step.status,
                  conclusion: step.conclusion,
                  number: step.number,
                })),
              })),
            };
            fs.writeFileSync(path.join(evidenceDir, 'deployment.json'), JSON.stringify(deployment, null, 2));
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`Production deployment is ${run.status}/${run.conclusion}`);
            }

            async function fetchExpected(name, route, marker) {
              let last = null;
              for (let attempt = 1; attempt <= 30; attempt += 1) {
                try {
                  const response = await fetch(`${baseUrl}${route}`, {
                    headers: { 'user-agent': 'ikimon-production-readonly-verifier/1.0' },
                    redirect: 'follow',
                  });
                  const body = await response.text();
                  last = { status: response.status, headers: Object.fromEntries(response.headers), body };
                  if (response.status === 200 && body.includes(marker)) break;
                } catch (error) {
                  last = { status: 0, headers: {}, body: String(error) };
                }
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
              fs.writeFileSync(path.join(evidenceDir, `${name}.json`), JSON.stringify(last, null, 2));
              if (!last || last.status !== 200 || !last.body.includes(marker)) {
                throw new Error(`${name} verification failed with status ${last?.status}`);
              }
              return last;
            }

            const runtimeResult = await fetchExpected('runtime-version', '/api/v1/runtime/version', targetSha);
            const healthResult = await fetchExpected('health', '/healthz', '"ok":true');
            const recoveryResult = await fetchExpected(
              'recovery-guest',
              '/ja/record?draft=1&start=photo&source=login_required',
              '写真・入力内容はこの端末に残っています',
            );
            const normalResult = await fetchExpected('record-normal', '/ja/record', '<html');

            const runtime = JSON.parse(runtimeResult.body);
            const health = JSON.parse(healthResult.body);
            const verification = {
              targetSha,
              runtimeGitSha: runtime.gitSha,
              runtimeEnv: runtime.runtimeEnv,
              builtAt: runtime.builtAt,
              migrationHead: runtime.migrationHead,
              healthOk: health.ok === true,
              recoveryMarkers: {
                draftRetained: recoveryResult.body.includes('写真・入力内容はこの端末に残っています'),
                loginAction: recoveryResult.body.includes('ログインして続ける'),
                registerAction: recoveryResult.body.includes('登録して続ける'),
              },
              normalRecordHtml: /<html/i.test(normalResult.body),
            };
            fs.writeFileSync(path.join(evidenceDir, 'public-verification.json'), JSON.stringify(verification, null, 2));
            if (runtime.gitSha !== targetSha) throw new Error(`Runtime SHA mismatch: ${runtime.gitSha}`);
            if (!verification.healthOk) throw new Error('Production health is not ok');
            if (!Object.values(verification.recoveryMarkers).every(Boolean)) throw new Error('Recovery markers missing');
            if (!verification.normalRecordHtml) throw new Error('Normal record page is not HTML');

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-recovery-production-evidence
          path: record-recovery-production-evidence
          if-no-files-found: error
          retention-days: 14

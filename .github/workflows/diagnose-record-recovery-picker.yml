name: Diagnose Record Recovery Picker

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/record-fallback-recovery-20260712

permissions:
  contents: read

concurrency:
  group: diagnose-record-recovery-picker
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/record-fallback-recovery-20260712' || github.ref_name == 'agent/record-fallback-recovery-20260712')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 1
      - name: Collect current recovery sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p record-recovery-picker-source/platform_v2/src/routes
          cp platform_v2/src/routes/read.ts record-recovery-picker-source/platform_v2/src/routes/read.ts
          cp platform_v2/src/routes/recordRecoverySource.contract.test.ts record-recovery-picker-source/platform_v2/src/routes/recordRecoverySource.contract.test.ts
          git rev-parse HEAD > record-recovery-picker-source/head-sha.txt
          sha256sum record-recovery-picker-source/platform_v2/src/routes/read.ts > record-recovery-picker-source/read-sha256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: record-recovery-picker-source
          path: record-recovery-picker-source
          if-no-files-found: error
          retention-days: 2

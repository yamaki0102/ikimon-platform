name: Deploy Cloudflare Staging
run-name: Cloudflare staging | branch=${{ inputs.branch }} | target=${{ inputs.commit_sha }} | browser=${{ inputs.browser_qa }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Cloudflare staging"
        required: true
        default: "main"
        type: string
      commit_sha:
        description: "Exact verified commit SHA to deploy (required when deploy_staging=true)"
        required: false
        default: ""
        type: string
      deploy_staging:
        description: "Deploy staging Worker and materialize staging R2"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      test_profile:
        description: "Portable staging preflight test profile"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      browser_qa:
        description: "Duplicate browser evidence in Actions only when explicitly needed; normal PR CI already owns affected-surface QA"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - targeted
          - full
      sync_staging_write_secret:
        description: "Rotate/sync the staging write secret before deploy; keep false for normal releases"
        required: true
        default: false
        type: boolean

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

env:
  IKIMON_CF_STAGING_DEPLOY_APPROVAL: APPROVE_IKIMON_CF_STAGING_WORKER_DEPLOY

jobs:
  cloudflare-staging:
    name: Deploy Cloudflare Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_PRIVILEGED_WRITE_API_KEY: ${{ secrets.V2_PRIVILEGED_WRITE_API_KEY }}
      DEPLOY_STAGING: ${{ github.event.inputs.deploy_staging || 'false' }}
      TEST_PROFILE: ${{ github.event.inputs.test_profile || 'quick' }}
      BROWSER_QA: ${{ github.event.inputs.browser_qa || 'none' }}
      SYNC_STAGING_WRITE_SECRET: ${{ github.event.inputs.sync_staging_write_secret || 'false' }}
      STAGING_BASE_URL: https://staging.ikimon.life
    steps:
      - name: Validate workflow target
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.inputs.branch || github.ref_name }}'
          TARGET_SHA='${{ github.event.inputs.commit_sha || github.sha }}'
          if ! printf '%s' "$BRANCH" | grep -qE '^[a-zA-Z0-9._/-]+$'; then
            echo "Invalid branch name: $BRANCH"
            exit 1
          fi
          if ! printf '%s' "$TARGET_SHA" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "Invalid commit SHA: $TARGET_SHA"
            exit 1
          fi
          if [ "${DEPLOY_STAGING}" = "true" ] && [ -z "${{ github.event.inputs.commit_sha }}" ]; then
            echo "commit_sha is required when deploy_staging=true"
            exit 1
          fi
          if [ "${DEPLOY_STAGING}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "A staging deploy must dispatch the trusted workflow from main; ref=$GITHUB_REF"
            exit 1
          fi
          echo "TARGET_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked-out commit is immutable
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$TARGET_SHA" ]; then
            echo "Checkout SHA drifted: expected=$TARGET_SHA actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: Checkout trusted release controls
        if: env.DEPLOY_STAGING == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 1

      - name: Require verified release candidate
        if: env.DEPLOY_STAGING == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.release-control/scripts/check_release_candidate.ps1 -Repository '${{ github.repository }}' -Branch "$env:TARGET_BRANCH" -Sha "$env:TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            platform_v2/package-lock.json
            platform_v2/cloudflare_shadow/package-lock.json

      - name: Run portable Cloudflare staging release
        run: bash ./scripts/run_cloudflare_staging_release.sh

      - name: Upload failure or explicitly requested full QA evidence
        if: failure() || github.event.inputs.browser_qa == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-staging-evidence
          path: |
            platform_v2/cloudflare_shadow/.deploy/
            platform_v2/cloudflare_shadow/materialize-staging-original-ui.json
            platform_v2/cloudflare_shadow/staging-*.json
            platform_v2/cloudflare_shadow/staging-demo.*
            platform_v2/cloudflare_shadow/staging-brand-icon.*
            platform_v2/test-results/
            platform_v2/playwright-report/staging/
          if-no-files-found: ignore
          retention-days: 3

      - name: Write Cloudflare staging summary
        if: always()
        run: |
          {
            echo "## Cloudflare Staging"
            echo ""
            echo "- Worker: \`ikimon-life-cloudflare-staging\`"
            echo "- Public URL / STAGING_BASE_URL: https://staging.ikimon.life"
            echo "- Health: https://staging.ikimon.life/healthz"
            echo "- Readiness: https://staging.ikimon.life/readyz"
            echo "- Demo smoke: https://staging.ikimon.life/demo/place-feeling-tags"
            echo "- R2 bucket: \`ikimon-shadow-media\`"
            echo "- D1: \`ikimon_shadow_core\`, \`ikimon_shadow_observations_2026_06\`"
            echo "- Portable runner: \`scripts/run_cloudflare_staging_release.sh\`"
            echo "- Browser QA: \`${BROWSER_QA}\`"
            echo "- Secret mutation requested: \`${SYNC_STAGING_WRITE_SECRET}\`"
            echo "- VPS SSH/deploy: \`not used\`"
            echo ""
            echo "### Optional full evidence contract"
            echo "- Run Cloudflare staging QA sitemap smoke: \`npm run e2e:staging:site-map\`"
            echo "- Evidence path: \`playwright-report/staging\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Cleanup Real Image Fix Temporary Files Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cleanup-real-image-fix-temp-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.head_ref == 'agent/fix-real-image-derivatives-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove one-shot executors and patch scripts
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/real-image-executor-trigger.txt \
            .github/workflows/apply-real-image-derivative-fix-once.yml \
            .github/workflows/fix-real-image-executor-narrowing-once.yml \
            .github/workflows/cleanup-real-image-fix-temp-once.yml \
            scripts/apply_real_image_derivative_fix_20260712.py \
            scripts/patch_image_test_harness_20260712.py \
            scripts/patch_real_image_derivative_fix_v2_20260712.py \
            scripts/patch_real_image_test_query_v3_20260712.py \
            scripts/patch_real_image_tests_v4_20260712.py \
            scripts/patch_real_image_tests_v5_20260712.py \
            scripts/patch_real_image_tests_v6_20260712.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: remove real image fix temporary files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Extract Photo Gate Source Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Extract photo gate and read model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p photo-gate-source
          {
            grep -n -A 180 -B 30 'function presentablePublicPhotoSql' platform_v2/cloudflare_shadow/src/index.ts || true
            grep -n -A 180 -B 30 'const presentablePublicPhotoSql' platform_v2/cloudflare_shadow/src/index.ts || true
            grep -n -A 150 -B 30 'function publicMapObservationItem' platform_v2/cloudflare_shadow/src/index.ts || true
          } > photo-gate-source/source.txt
          test -s photo-gate-source/source.txt
      - uses: actions/upload-artifact@v6
        with:
          name: photo-gate-source
          path: photo-gate-source
          if-no-files-found: error
          retention-days: 3

name: Patch Rally Mission Expectation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/worker-rally-auto-match' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/worker-rally-auto-match
          fetch-depth: 0
      - name: Update mission count and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('platform_v2/cloudflare_shadow/src/index.test.ts')
          source = path.read_text(encoding='utf-8')
          old = '    assert.equal(rallyPayload.rally.missions.length, 1);\n'
          new = '    assert.equal(rallyPayload.rally.missions.length, 2);\n'
          if old not in source:
              raise SystemExit('mission count marker not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/rally-d1-diagnostics.yml
      - name: Commit scoped test correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform_v2/cloudflare_shadow/src/index.test.ts .github/workflows/rally-d1-diagnostics.yml
          git diff --cached --check
          git commit -m "test: account for auto-match rally mission"
          git push origin HEAD:agent/worker-rally-auto-match

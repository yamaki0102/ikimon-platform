name: Rally D1 Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/worker-rally-auto-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - name: Install dependencies
        working-directory: platform_v2/cloudflare_shadow
        run: npm ci
      - name: Capture complete checks
        id: checks
        working-directory: platform_v2/cloudflare_shadow
        shell: bash
        run: |
          set +e
          {
            echo '=== check ==='
            npm run check
            check_status=$?
            echo "check_status=$check_status"
            echo '=== quick ==='
            npm run test:quick
            quick_status=$?
            echo "quick_status=$quick_status"
            echo '=== full ==='
            npm run test
            full_status=$?
            echo "full_status=$full_status"
            if [ "$check_status" -ne 0 ] || [ "$quick_status" -ne 0 ] || [ "$full_status" -ne 0 ]; then
              final_status=1
            else
              final_status=0
            fi
            echo "exit_code=$final_status" >> "$GITHUB_OUTPUT"
          } > rally-d1-diagnostics.log 2>&1
          tail -n 220 rally-d1-diagnostics.log || true
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rally-d1-diagnostics
          path: platform_v2/cloudflare_shadow/rally-d1-diagnostics.log
          if-no-files-found: error
      - name: Preserve failure
        if: steps.checks.outputs.exit_code != '0'
        run: exit 1

name: Patch Logout Origin Error Status

on:
  push:
    branches:
      - agent/logout-csrf-confirmation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/logout-csrf-confirmation
          fetch-depth: 0
      - name: Make cross-site logout an explicit 403
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform_v2/src/routes/auth.ts')
          source = path.read_text(encoding='utf-8')
          old = '''  app.post("/logout", async (request, reply) => {
            assertSameOriginRequest(request);
            const result = await revokeSession(readSessionTokenFromCookie(request.headers.cookie));
            reply.header("set-cookie", result.clearedCookie);
            reply.code(303).redirect(withBasePath(requestBasePath(request), "/"));
          });'''
          new = '''  app.post("/logout", async (request, reply) => {
            try {
              assertSameOriginRequest(request);
              const result = await revokeSession(readSessionTokenFromCookie(request.headers.cookie));
              reply.header("set-cookie", result.clearedCookie);
              reply.code(303).redirect(withBasePath(requestBasePath(request), "/"));
            } catch (error) {
              if (error instanceof Error && error.message === "same_origin_required") {
                reply.code(403).type("text/plain; charset=utf-8").send("Forbidden");
                return;
              }
              throw error;
            }
          });'''
          if old not in source:
              raise SystemExit('logout handler marker not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-logout-error-status.yml
      - name: Commit scoped patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform_v2/src/routes/auth.ts .github/workflows/patch-logout-error-status.yml
          git diff --cached --check
          git commit -m "fix: return forbidden for cross-site logout"
          git push origin HEAD:agent/logout-csrf-confirmation

name: Temporary apply Place Atlas timeline artifact

on:
  push:
    branches:
      - feat/place-atlas-timeline-ui
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply-verified-artifact:
    if: >-
      github.repository == 'yamaki0102/ikimon-platform' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/feat/place-atlas-timeline-ui') ||
        (github.event_name == 'pull_request' && github.event.pull_request.number == 1456 && github.event.pull_request.head.ref == 'feat/place-atlas-timeline-ui')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/place-atlas-timeline-ui
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Fetch, authenticate, and unpack Codex patch artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: '5084846867'
        run: |
          python <<'PY'
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          import pathlib
          import re
          import tarfile
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          comment_id = os.environ['COMMENT_ID']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/issues/comments/{comment_id}'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'ikimon-place-timeline-artifact-applier',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comment = json.load(response)

          author = (comment.get('user') or {}).get('login')
          if author != 'chatgpt-codex-connector[bot]':
              raise SystemExit(f'unexpected artifact author: {author!r}')

          body = comment.get('body') or ''
          match = re.search(
              r'<!--\s*issue-1450\.tar\.xz\.base64\s*\n([A-Za-z0-9+/=\r\n]+?)\n\s*-->',
              body,
          )
          if not match:
              raise SystemExit('artifact marker not found')

          encoded = ''.join(match.group(1).split())
          archive = base64.b64decode(encoded, validate=True)
          archive_sha = hashlib.sha256(archive).hexdigest()
          print(f'artifact_sha256={archive_sha}')
          print(f'artifact_bytes={len(archive)}')

          tar_bytes = lzma.decompress(archive, format=lzma.FORMAT_XZ)
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tar:
              members = tar.getmembers()
              if len(members) != 1:
                  raise SystemExit(f'unexpected tar member count: {len(members)}')
              member = members[0]
              if not member.isfile() or member.name != 'issue-1450.patch':
                  raise SystemExit(f'unexpected tar member: {member.name!r}')
              source = tar.extractfile(member)
              if source is None:
                  raise SystemExit('patch member could not be read')
              patch = source.read()

          if len(patch) > 1_000_000:
              raise SystemExit('patch is unexpectedly large')
          patch_path = pathlib.Path('/tmp/issue-1450.patch')
          patch_path.write_bytes(patch)
          print(f'patch_sha256={hashlib.sha256(patch).hexdigest()}')
          print(f'patch_bytes={len(patch)}')
          PY

      - name: Verify patch scope and apply
        env:
          BASE_SHA: 0d4501edd48c8e57c9bb0ce4e44a6f0d4aa19d1c
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          platform_v2/src/routes/mapApi.publicMap.routes.test.ts
          platform_v2/src/routes/mapApi.ts
          platform_v2/src/ui/mapPlaceAtlasProfile.test.ts
          platform_v2/src/ui/mapPlaceAtlasProfile.ts
          EOF
          git apply --numstat /tmp/issue-1450.patch | awk '{print $3}' | sort -u >"$actual"
          diff -u "$expected" "$actual"
          git apply --check /tmp/issue-1450.patch
          git apply /tmp/issue-1450.patch
          rm -f .codex-handoff/issue-1450.md
          rmdir .codex-handoff 2>/dev/null || true
          rm -f .github/workflows/apply-place-timeline-artifact.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check

      - name: Install dependencies
        working-directory: platform_v2
        run: npm ci

      - name: Run targeted tests
        working-directory: platform_v2
        run: npx tsx --test src/ui/mapPlaceAtlasProfile.test.ts src/routes/mapApi.publicMap.routes.test.ts src/services/placeAtlasTimeline.test.ts

      - name: Run strict typecheck
        working-directory: platform_v2
        run: npm run typecheck

      - name: Verify final PR diff is exactly four files
        env:
          BASE_SHA: 0d4501edd48c8e57c9bb0ce4e44a6f0d4aa19d1c
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          platform_v2/src/routes/mapApi.publicMap.routes.test.ts
          platform_v2/src/routes/mapApi.ts
          platform_v2/src/ui/mapPlaceAtlasProfile.test.ts
          platform_v2/src/ui/mapPlaceAtlasProfile.ts
          EOF
          git diff --name-only "$BASE_SHA" | sort >"$actual"
          diff -u "$expected" "$actual"
          git diff --check

      - name: Commit and push verified source-only implementation
        run: |
          set -euo pipefail
          git config user.name 'ikimon-source-applier[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: render Place Atlas timeline projection'
          git push origin HEAD:feat/place-atlas-timeline-ui

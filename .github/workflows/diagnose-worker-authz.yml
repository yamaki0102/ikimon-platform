name: Patch Worker Authz

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/worker-place-memory-authz' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/worker-place-memory-authz
          fetch-depth: 0
      - name: Fetch historical remediation source
        shell: bash
        run: |
          git fetch origin codex/fix-production-qa-p0-p1-20260710 --depth=1
          mkdir -p .tmp-worker-authz/historical
          git show FETCH_HEAD:platform_v2/cloudflare_shadow/src/index.ts > .tmp-worker-authz/historical/index.ts
          git show FETCH_HEAD:platform_v2/cloudflare_shadow/src/index.test.ts > .tmp-worker-authz/historical/index.test.ts
      - name: Apply scoped authorization patch
        run: python scripts/patch-worker-authz.py
      - name: Remove temporary diagnostic files
        shell: bash
        run: |
          rm -rf .tmp-worker-authz
          rm .github/workflows/diagnose-worker-authz.yml
          rm scripts/patch-worker-authz.py
          rm docs/plans/worker_authz_diagnostic_trigger.md
      - name: Commit scoped runtime and test changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform_v2/cloudflare_shadow/src/index.ts \
            platform_v2/cloudflare_shadow/src/index.test.ts \
            .github/workflows/diagnose-worker-authz.yml \
            scripts/patch-worker-authz.py \
            docs/plans/worker_authz_diagnostic_trigger.md
          git diff --cached --check
          git commit -m "security: enforce Worker observation and Place Memory ownership"
          git push origin HEAD:agent/worker-place-memory-authz

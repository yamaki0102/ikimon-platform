name: Apply Real Image Derivative Fix Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-real-image-derivative-fix-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-real-image-derivatives-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - name: Apply reviewed product patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real-image-derivative-evidence
          python scripts/apply_real_image_derivative_fix_20260712.py 2>&1 | tee real-image-derivative-evidence/apply.log
          python <<'PY'
          from pathlib import Path
          import re

          index_path = Path('platform_v2/cloudflare_shadow/src/index.ts')
          source = index_path.read_text(encoding='utf-8')
          old = '''  const contentType = (outputResponse.headers.get("content-type") ?? "")
              .split(";", 1)[0]
              .trim()
              .toLowerCase();'''.replace('              ', '    ')
          new = '''  const contentType = ((outputResponse.headers.get("content-type") ?? "")
              .split(";", 1)[0] ?? "")
              .trim()
              .toLowerCase();'''.replace('              ', '    ')
          if old in source:
            source = source.replace(old, new, 1)
            index_path.write_text(source, encoding='utf-8')
          elif 'cloudflare-images-public-derivative-v1' in source and new not in source:
            around = source[source.index('const contentType =', source.index('cloudflare-images-public-derivative-v1')):][:240]
            raise SystemExit('content type narrowing target not found: ' + repr(around))

          test_path = Path('platform_v2/cloudflare_shadow/src/index.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          test_marker = 'fake-cloudflare-images-binding-v1'
          if test_marker not in tests:
            anchor = 'const INTERNAL_AUTH_TOKEN = "test-internal-token";\n'
            if tests.count(anchor) != 1:
              raise SystemExit(f'test binding anchor count={tests.count(anchor)}')
            fake_binding = r'''

// fake-cloudflare-images-binding-v1: deterministic binary WebP-shaped output for Worker unit tests.
const FAKE_WEBP_BYTES = new Uint8Array([82, 73, 70, 70, 16, 0, 0, 0, 87, 69, 66, 80, 86, 80, 56, 32]);
const fakeImagesBinding = {
  async info(_stream: ReadableStream | ArrayBuffer) {
    return { format: "webp", fileSize: FAKE_WEBP_BYTES.byteLength, width: 640, height: 480 };
  },
  input(_stream: ReadableStream | ArrayBuffer) {
    const handle = {
      transform(_options: Record<string, unknown>) {
        return handle;
      },
      async output(_options: { format: string; quality?: number | string; anim?: boolean }) {
        return {
          response() {
            return new Response(FAKE_WEBP_BYTES.slice(), {
              status: 200,
              headers: { "content-type": "image/webp" }
            });
          }
        };
      }
    };
    return handle;
  }
};
'''
            tests = tests.replace(anchor, anchor + fake_binding, 1)
            pattern = re.compile(r'^(\s*)ASSET_BUCKET:\s*([^\n]+),\s*$', re.MULTILINE)
            def add_images(match: re.Match[str]) -> str:
              indent = match.group(1)
              return match.group(0) + f'\n{indent}IMAGES: fakeImagesBinding,'
            tests, binding_count = pattern.subn(add_images, tests)
            if binding_count < 1:
              raise SystemExit('no ASSET_BUCKET test environments found')
            print(f'patched_test_env_images_bindings={binding_count}')
            test_path.write_text(tests, encoding='utf-8')
          PY
          if grep -q 'patch_status=changed' real-image-derivative-evidence/apply.log; then
            echo 'status=changed' >> "$GITHUB_OUTPUT"
          else
            echo 'status=unchanged' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.patch.outputs.status == 'changed'
        run: npm --prefix platform_v2/cloudflare_shadow ci
      - name: Verify Worker and binding contracts
        if: steps.patch.outputs.status == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          {
            npm --prefix platform_v2/cloudflare_shadow run check
            (cd platform_v2/cloudflare_shadow && npx tsx --test src/realImageDerivativeContract.test.ts)
            npm --prefix platform_v2/cloudflare_shadow run test:quick
            (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env shadow)
            (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env staging)
            (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env production)
            git diff --check
          } 2>&1 | tee real-image-derivative-evidence/verify.log
      - name: Commit verified product changes
        if: steps.patch.outputs.status == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_v2/cloudflare_shadow/src/index.ts \
                  platform_v2/cloudflare_shadow/src/index.test.ts \
                  platform_v2/cloudflare_shadow/src/realImageDerivativeContract.test.ts \
                  platform_v2/cloudflare_shadow/wrangler.jsonc
          git commit -m "fix: generate real private-safe WebP derivatives"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-image-derivative-executor
          path: real-image-derivative-evidence
          if-no-files-found: error
          retention-days: 5

name: Inspect Records Deploy Run

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 433b0c146ec7b05036ad26a5b76f6e8523c767e5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect deploy run and record page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30" > runs.json
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const payload = JSON.parse(fs.readFileSync('runs.json', 'utf8'));
          const run = (payload.workflow_runs || []).find((item) => item.head_sha === expected);
          if (!run) {
            console.log(JSON.stringify({ expectedSha: expected, found: false }, null, 2));
            process.exit(2);
          }
          console.log(JSON.stringify({ expectedSha: expected, found: true, id: run.id, runNumber: run.run_number, status: run.status, conclusion: run.conclusion, htmlUrl: run.html_url, createdAt: run.created_at, updatedAt: run.updated_at }, null, 2));
          NODE
          curl -fsSL -H 'cache-control: no-store' "https://ikimon.life/ja/record?deploy_smoke=${EXPECTED_SHA}" > record.html
          echo "source=record_saved count: $(grep -o 'source=record_saved' record.html | wc -l)"
          echo "saved= count: $(grep -o 'saved=' record.html | wc -l)"
          echo "record-success-shortcuts count: $(grep -o 'record-success-shortcuts' record.html | wc -l)"

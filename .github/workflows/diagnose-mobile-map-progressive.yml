name: Diagnose Mobile Map Progressive Controls

on:
  push:
    branches:
      - agent/mobile-map-progressive-controls-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-mobile-map-progressive
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mobile-map-progressive-controls-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mobile-map-progressive-controls-20260712
          fetch-depth: 1

      - name: Collect focused map sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-map-diagnostic/src/ui mobile-map-diagnostic/src/routes mobile-map-diagnostic/e2e
          cp platform_v2/src/ui/mapExplorer.ts mobile-map-diagnostic/src/ui/
          cp platform_v2/src/ui/mapExplorer.test.ts mobile-map-diagnostic/src/ui/
          cp platform_v2/src/routes/mapRead.ts mobile-map-diagnostic/src/routes/
          cp platform_v2/src/routes/map.read.routes.test.ts mobile-map-diagnostic/src/routes/
          cp platform_v2/e2e/map.staging.spec.ts mobile-map-diagnostic/e2e/
          cp platform_v2/e2e/notes-map-regression.staging.spec.ts mobile-map-diagnostic/e2e/
          cp platform_v2/e2e/landing-top-visual.spec.ts mobile-map-diagnostic/e2e/
          {
            echo '=== render shell and controls ==='
            rg -n -C 10 'renderMapExplorer|me-filter|me-tab|me-search|me-locate|legend|season|basemap|region|drawer|bottom-sheet|side-panel' platform_v2/src/ui/mapExplorer.ts || true
            echo '=== mobile CSS ==='
            rg -n -C 10 '@media|390px|768px|me-map|me-toolbar|me-filter|me-tabs|me-controls|me-bottom' platform_v2/src/ui/mapExplorer.ts || true
            echo '=== interaction state ==='
            rg -n -C 10 'querySelector|addEventListener|aria-expanded|hidden|classList|bottomSheet|sidePanel|legend' platform_v2/src/ui/mapExplorer.ts || true
          } > mobile-map-diagnostic/grep-context.txt

      - name: Upload mobile map source diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: mobile-map-progressive-diagnostic
          path: mobile-map-diagnostic
          if-no-files-found: error
          retention-days: 7

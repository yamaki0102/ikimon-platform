name: Staging UX Review Capture

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review on staging"
        required: false
        default: "staging"
        type: string
      path:
        description: "Path to open"
        required: false
        default: "/ja/map?tab=places&lng=137.70148&lat=34.6970&z=17.2"
        type: string

permissions:
  contents: read

jobs:
  rain-nowcast-map-review:
    name: Rain nowcast map review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup platform_v2 browser runtime
        uses: ./.github/actions/setup-platform-v2-browser
        with:
          install-with-deps: "false"

      - name: Capture staging rain nowcast review
        working-directory: platform_v2
        env:
          STAGING_BASE_URL: https://staging.ikimon.life
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
          REVIEW_PATH: ${{ github.event.inputs.path }}
        run: |
          node <<'NODE'
          const { chromium } = require("@playwright/test");
          const { mkdirSync, writeFileSync } = require("node:fs");
          const path = require("node:path");

          const baseUrl = process.env.STAGING_BASE_URL || "https://staging.ikimon.life";
          const reviewPath = process.env.REVIEW_PATH || "/ja/map?tab=places&lng=137.70148&lat=34.6970&z=17.2";
          const username = process.env.STAGING_BASIC_AUTH_USER || "";
          const password = process.env.STAGING_BASIC_AUTH_PASS || "";
          const outDir = path.resolve("test-results", "staging-ux-review");
          mkdirSync(outDir, { recursive: true });

          const profiles = [
            { slug: "desktop-1440", viewport: { width: 1440, height: 900 } },
            { slug: "mobile-390", viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ];

          function stateScript() {
            const text = (selector) => document.querySelector(selector)?.textContent?.replace(/\s+/g, " ").trim() || "";
            const attr = (selector, name) => document.querySelector(selector)?.getAttribute(name) || "";
            const boxOf = (selector) => {
              const el = document.querySelector(selector);
              if (!el) return null;
              const box = el.getBoundingClientRect();
              return { x: Math.round(box.x), y: Math.round(box.y), width: Math.round(box.width), height: Math.round(box.height) };
            };
            return {
              title: document.title,
              url: location.href,
              rainCardEnabled: attr("#me-rain-card", "data-enabled"),
              rainTogglePressed: attr("#me-rain-toggle", "aria-pressed"),
              rainStatus: text("#me-rain-status"),
              rainCardBox: boxOf("#me-rain-card"),
              mapBox: boxOf(".me-map-wrap"),
              tabText: text(".me-mode-tabs"),
              sideHeading: text(".me-side-title, .me-results-title"),
              bodyTextSample: document.body.textContent?.replace(/\s+/g, " ").trim().slice(0, 1200) || "",
            };
          }

          (async () => {
            const browser = await chromium.launch();
            const results = [];
            for (const profile of profiles) {
              const context = await browser.newContext({
                baseURL: baseUrl,
                viewport: profile.viewport,
                isMobile: profile.isMobile,
                hasTouch: profile.hasTouch,
                ignoreHTTPSErrors: true,
                httpCredentials: username && password ? { username, password } : undefined,
              });
              const page = await context.newPage();
              const entry = { profile: profile.slug, ok: false, errors: [] };
              try {
                const response = await page.goto(reviewPath, { waitUntil: "domcontentloaded", timeout: 45000 });
                entry.status = response ? response.status() : null;
                await page.waitForSelector(".me-map-wrap", { state: "visible", timeout: 15000 }).catch((error) => {
                  entry.errors.push(`map wait: ${String(error)}`);
                });
                await page.locator("#me-rain-toggle").click({ timeout: 8000 }).catch((error) => {
                  entry.errors.push(`rain click: ${String(error)}`);
                });
                await page.waitForTimeout(3000);
                entry.state = await page.evaluate(stateScript);
                await page.screenshot({ path: path.join(outDir, `rain-nowcast-${profile.slug}.png`), fullPage: false });
                entry.ok = true;
              } catch (error) {
                entry.errors.push(String(error));
                try {
                  entry.state = await page.evaluate(stateScript);
                  await page.screenshot({ path: path.join(outDir, `rain-nowcast-${profile.slug}-error.png`), fullPage: false });
                } catch (captureError) {
                  entry.errors.push(`error capture: ${String(captureError)}`);
                }
              } finally {
                results.push(entry);
                await context.close().catch(() => {});
              }
            }
            await browser.close();
            writeFileSync(path.join(outDir, "rain-nowcast-review.json"), JSON.stringify({
              generatedAt: new Date().toISOString(),
              baseUrl,
              reviewPath,
              results,
            }, null, 2));
          })().catch((error) => {
            writeFileSync(path.join(outDir, "rain-nowcast-review-crash.txt"), String(error));
          });
          NODE

      - name: Upload UX review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-ux-review-rain-nowcast
          path: platform_v2/test-results/staging-ux-review/
          if-no-files-found: warn

name: Fix July Repair Runner Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/repair-july-real-images-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Keep D1 SQL file inside Worker directory
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repair-july-real-images-once.yml')
          source = path.read_text(encoding='utf-8')
          replacements = [
            ("fs.writeFileSync(root + '/enqueue.sql', statements.join('\\n') + '\\n');", "fs.writeFileSync(process.cwd() + '/repair-enqueue.sql', statements.join('\\n') + '\\n');"),
            ('--file "$root/enqueue.sql"', '--file repair-enqueue.sql'),
            ('rm -f "$root/enqueue.sql" "$root/outbox.private.json"', 'rm -f repair-enqueue.sql "$root/outbox.private.json"'),
          ]
          for old, new in replacements:
            if old in source:
              source = source.replace(old, new, 1)
            elif new not in source:
              raise SystemExit(f'missing target: {old}')
          path.write_text(source, encoding='utf-8')
          PY
          git rm .github/workflows/fix-july-repair-runner-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-july-real-images-once.yml
          git commit -m "ops: fix D1 repair SQL file path"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Deploy TSUNARU LOCAL preview

on:
  push:
    branches:
      - preview/tsunaru-hottarakashi
    paths:
      - previews/tsunaru-local/**
      - .github/workflows/deploy-tsunaru-local-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tsunaru-local-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build preview site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/tsunaru-local
          cp -R previews/tsunaru-local/hottarakashi _site/tsunaru-local/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSUNARU LOCAL Preview</title><style>body{font-family:system-ui;margin:40px;line-height:1.7}a{color:#165c5a;font-weight:700}</style><h1>TSUNARU LOCAL Preview</h1><p><a href="./tsunaru-local/hottarakashi/">食彩酒房 ほったらかし サンプルを開く</a></p>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

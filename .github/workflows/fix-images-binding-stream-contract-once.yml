name: Fix Images Binding Stream Contract Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-images-binding-stream-contract-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/fix-real-image-derivatives-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - name: Align Images binding with Cloudflare stream API
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('platform_v2/cloudflare_shadow/src/index.ts')
          source = path.read_text(encoding='utf-8')
          replacements = [
            ('input(stream: ReadableStream | ArrayBuffer): ImagesTransformation;', 'input(stream: ReadableStream): ImagesTransformation;'),
            ('info(stream: ReadableStream | ArrayBuffer): Promise<ImagesInfo>;', 'info(stream: ReadableStream): Promise<ImagesInfo>;'),
            ('originalInfo = await images.info(originalBytes.slice(0));', 'originalInfo = await images.info(new Response(originalBytes.slice(0)).body!);'),
            ('.input(originalBytes.slice(0))', '.input(new Response(originalBytes.slice(0)).body!)'),
            ('derivativeInfo = await images.info(derivativeBody.slice(0));', 'derivativeInfo = await images.info(new Response(derivativeBody.slice(0)).body!);'),
          ]
          for old, new in replacements:
            if old in source:
              source = source.replace(old, new, 1)
            elif new not in source:
              raise SystemExit(f'missing stream contract target: {old}')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2/cloudflare_shadow ci
          npm --prefix platform_v2/cloudflare_shadow run check
          npm --prefix platform_v2/cloudflare_shadow run test:quick
          (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env shadow)
          (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env staging)
          (cd platform_v2/cloudflare_shadow && npx wrangler deploy --dry-run --env production)
          git diff --check
      - name: Commit product-only correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-images-binding-stream-contract-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_v2/cloudflare_shadow/src/index.ts
          git commit -m "fix: use streams for Cloudflare Images binding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

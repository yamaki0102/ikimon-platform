name: Fix Owner Home Final Contracts Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Correct generated service worker regex and strengthen runtime test
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          app_path = Path('platform_v2/src/appInstall.ts')
          app = app_path.read_text(encoding='utf-8')
          lines = app.splitlines()
          personal = r"const PERSONAL_NAV_RE = /^\\/(?:ja|en|es|pt-br)?\\/?(?:$|home\\/?$|profile(?:\\/settings)?\\/?$|settings\\/?$|records\\/?$|record\\/?$)/;"
          refresh = r"const REFRESH_NAV_RE = /^\\/(?:ja|en|es|pt-br)?\\/?(?:$|map\\/?$|home\\/?$|profile(?:\\/settings)?\\/?$|settings\\/?$|records\\/?$|record\\/?$)/;"
          personal_count = 0
          refresh_count = 0
          for index, line in enumerate(lines):
              if line.startswith('const PERSONAL_NAV_RE = '):
                  lines[index] = personal
                  personal_count += 1
              if line.startswith('const REFRESH_NAV_RE = '):
                  lines[index] = refresh
                  refresh_count += 1
          if personal_count != 1 or refresh_count != 1:
              raise SystemExit(f'PWA regex lines personal={personal_count} refresh={refresh_count}')
          app_path.write_text('\n'.join(lines) + ('\n' if app.endswith('\n') else ''), encoding='utf-8')

          pwa_test_path = Path('platform_v2/src/routes/pwa.routes.test.ts')
          pwa_tests = pwa_test_path.read_text(encoding='utf-8')
          anchor = '    assert.match(response.body, /networkFirstNavigation/);'
          syntax_assertion = '    assert.doesNotThrow(() => new Function(response.body));'
          if syntax_assertion not in pwa_tests:
              if pwa_tests.count(anchor) != 1:
                  raise SystemExit(f'PWA syntax assertion anchor count={pwa_tests.count(anchor)}')
              pwa_tests = pwa_tests.replace(anchor, anchor + '\n' + syntax_assertion, 1)
          pwa_test_path.write_text(pwa_tests, encoding='utf-8')

          index_test_path = Path('platform_v2/cloudflare_shadow/src/index.test.ts')
          index_tests = index_test_path.read_text(encoding='utf-8')
          start = index_tests.index('test("production home prioritizes signed-in owner records over public feed records"')
          end = index_tests.index('\n});', start) + len('\n});')
          block = index_tests[start:end]
          old_fixture = '"<main><section class=\\"prototype-record-feed\\" data-record-feed>",'
          new_fixture = '"<main><section class=\\"prototype-record-feed is-guest\\" data-record-feed>",'
          if old_fixture in block:
              block = block.replace(old_fixture, new_fixture, 1)
          elif new_fixture not in block:
              raise SystemExit('owner runtime fixture not found')
          owner_assertion = '  assert.match(homeBody, /prototype-record-feed is-owner/);'
          added = '''  assert.match(homeBody, /prototype-record-feed is-owner/);
          assert.doesNotMatch(homeBody, /prototype-record-feed is-guest/);
          assert.match(homeBody, /data-owner-home-state-v2/);'''
          if 'assert.doesNotMatch(homeBody, /prototype-record-feed is-guest/);' not in block:
              if block.count(owner_assertion) != 1:
                  raise SystemExit(f'owner assertion count={block.count(owner_assertion)}')
              block = block.replace(owner_assertion, added, 1)
          index_tests = index_tests[:start] + block + index_tests[end:]
          index_test_path.write_text(index_tests, encoding='utf-8')
          PY

          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          (cd platform_v2 && npx tsx --test src/routes/pwa.routes.test.ts src/deployPwaVersionContract.test.ts)
          npm --prefix platform_v2/cloudflare_shadow ci
          npm --prefix platform_v2/cloudflare_shadow run check
          git diff --check

          rm -f .github/workflows/fix-owner-home-final-contracts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            platform_v2/src/appInstall.ts \
            platform_v2/src/routes/pwa.routes.test.ts \
            platform_v2/cloudflare_shadow/src/index.test.ts \
            .github/workflows/fix-owner-home-final-contracts-once.yml
          git commit -m "test: verify owner home state and service worker syntax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

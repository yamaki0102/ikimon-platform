name: Diagnose Record Fallback Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diagnose-record-fallback-recovery
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/record-fallback-recovery-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 1

      - name: Collect record route sources and state contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p record-fallback-diagnostic/files
          rg -l \
            'record-first-success|record-submit-panel|buildRecordSuccessReturnHtml|record-status|record-media-photo|MAX_PHOTO_FILES' \
            platform_v2/src platform_v2/e2e \
            | sort -u > record-fallback-diagnostic/matching-files.txt
          while IFS= read -r file; do
            mkdir -p "record-fallback-diagnostic/files/$(dirname "$file")"
            cp "$file" "record-fallback-diagnostic/files/$file"
          done < record-fallback-diagnostic/matching-files.txt

          {
            echo '=== route registration and page renderer ==='
            rg -n -C 10 '(/record|record-first-success|record-submit-panel|record-status)' platform_v2/src || true
            echo '=== draft persistence and restore ==='
            rg -n -C 12 'localStorage|sessionStorage|draft|restore|復元|下書き|pending.*media|selectedMediaFiles' platform_v2/src platform_v2/e2e || true
            echo '=== auth and fallback entry ==='
            rg -n -C 12 'location_denied|permission|geolocation|login_required|unauth|source=|fallback|位置情報|未ログイン' platform_v2/src platform_v2/e2e || true
            echo '=== navigation to record ==='
            rg -n -C 8 "['\"]/?record|/record\?" platform_v2/src platform_v2/e2e || true
            echo '=== record route tests ==='
            rg -n -C 5 'record route|draft|restore|location|login|fallback' platform_v2/src/routes/record.routes.test.ts platform_v2/e2e/record-funnel.staging.spec.ts || true
          } > record-fallback-diagnostic/grep-context.txt

          git rev-parse HEAD > record-fallback-diagnostic/head-sha.txt

      - name: Upload record fallback diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: record-fallback-recovery-diagnostic
          path: record-fallback-diagnostic
          if-no-files-found: error
          retention-days: 7

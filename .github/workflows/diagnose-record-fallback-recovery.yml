name: Diagnose Record Fallback Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diagnose-record-fallback-recovery
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/record-fallback-recovery-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 1

      - name: Collect record route sources and state contracts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p record-fallback-diagnostic/files
          : > record-fallback-diagnostic/matching-files.txt
          grep -RIlE \
            'record-first-success|record-submit-panel|buildRecordSuccessReturnHtml|record-status|record-media-photo|MAX_PHOTO_FILES' \
            platform_v2/src platform_v2/e2e 2>/dev/null \
            | sort -u >> record-fallback-diagnostic/matching-files.txt || true
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            destination="record-fallback-diagnostic/files/$file"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done < record-fallback-diagnostic/matching-files.txt

          context() {
            local pattern="$1"
            shift
            grep -RInE -C 10 -- "$pattern" "$@" 2>/dev/null || true
          }
          {
            echo '=== route registration and page renderer ==='
            context '(/record|record-first-success|record-submit-panel|record-status)' platform_v2/src
            echo '=== draft persistence and restore ==='
            context 'localStorage|sessionStorage|draft|restore|復元|下書き|pending.*media|selectedMediaFiles' platform_v2/src platform_v2/e2e
            echo '=== auth and fallback entry ==='
            context 'location_denied|permission|geolocation|login_required|unauth|source=|fallback|位置情報|未ログイン' platform_v2/src platform_v2/e2e
            echo '=== navigation to record ==='
            context '/record' platform_v2/src platform_v2/e2e
            echo '=== record route tests ==='
            grep -nE -C 5 'record route|draft|restore|location|login|fallback' \
              platform_v2/src/routes/record.routes.test.ts \
              platform_v2/e2e/record-funnel.staging.spec.ts 2>/dev/null || true
          } > record-fallback-diagnostic/grep-context.txt

          git rev-parse HEAD > record-fallback-diagnostic/head-sha.txt
          find record-fallback-diagnostic -maxdepth 8 -type f -print | sort > record-fallback-diagnostic/artifact-files.txt

      - name: Upload record fallback diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-fallback-recovery-diagnostic
          path: record-fallback-diagnostic
          if-no-files-found: error
          retention-days: 7

name: AI Usage v2 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ai-usage-v2-validation.yml"
      - "platform_v2/db/migrations/0140_ai_usage_control.sql"
      - "platform_v2/db/migrations/0141_ai_usage_control_hardening.sql"
      - "platform_v2/db/migrations/0142_ai_usage_metadata_allowlist.sql"
      - "platform_v2/db/migrations/0143_ai_usage_contract_v2.sql"
      - "platform_v2/db/migrations/0144_ai_usage_invocation_identity.sql"
      - "platform_v2/src/services/**"
  push:
    branches:
      - codex/zukan-context-ai-usage-v2-20260729
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-usage-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_usage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: platform_v2

    env:
      AI_USAGE_TEST_ALLOW_MUTATION: "1"
      AI_USAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_usage_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted AI usage tests
        run: >-
          npx tsx --test
          src/services/aiUsageControl.test.ts
          src/services/aiExecutionBoundary.test.ts
          src/services/aiUsageLegacyCostProjection.test.ts
          src/services/aiUsagePersistenceMigration.test.ts
          src/services/aiUsagePostgresRepository.test.ts
          src/services/aiUsagePostgresIntegration.test.ts
          src/services/aiProviderBoundary.test.ts
          src/services/zukanContextPacketContract.test.ts
          src/services/zukanSourceImportEvidenceEnvelope.test.ts

      - name: Full Node test suite
        run: npm run test:node

      - name: Build
        run: npm run build

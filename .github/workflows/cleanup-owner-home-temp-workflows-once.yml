name: Cleanup Owner Home Temporary Workflows Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove temporary diagnostic and executor workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-owner-home-fix-once.yml \
            .github/workflows/apply-owner-home-product-v2.yml \
            .github/workflows/diagnose-owner-home-production-once.yml \
            .github/workflows/diagnose-photo-gate-production-once.yml \
            .github/workflows/extract-launcher-source-once.yml \
            .github/workflows/extract-owner-home-source-once.yml \
            .github/workflows/extract-photo-gate-source-once.yml \
            .github/workflows/fix-owner-home-executor-command-once.yml \
            .github/workflows/cleanup-owner-home-temp-workflows-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: remove owner home temporary workflows"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

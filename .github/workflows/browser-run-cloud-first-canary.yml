name: Browser Run cloud-first canary

on:
  push:
    branches:
      - noah/browser-run-cloud-first-20260920
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_PRIVILEGED_WRITE_API_KEY: ${{ secrets.V2_PRIVILEGED_WRITE_API_KEY }}
      STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
      STAGING_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json
      - name: Install
        working-directory: platform_v2
        run: npm ci
      - name: Typecheck
        working-directory: platform_v2
        run: npm run typecheck
      - name: Server build
        working-directory: platform_v2
        run: npm run build:server
      - name: Browser Run normal
        working-directory: platform_v2
        run: npm run e2e:browser-run
      - name: Browser Run diagnostic evidence
        working-directory: platform_v2
        run: npm run e2e:browser-run:diagnostic
      - name: Upload Browser Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-run-cloud-first-canary
          path: |
            platform_v2/test-results
            platform_v2/playwright-report/browser-run
          if-no-files-found: warn
          retention-days: 7

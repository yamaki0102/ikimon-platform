name: Diagnose Photo Gate Production Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - working-directory: platform_v2/cloudflare_shadow
        run: npm ci
      - name: Evaluate the production placeholder gate
        working-directory: platform_v2/cloudflare_shadow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p photo-gate-production-diagnostic
          node <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const db = 'ikimon_prod_observations_2026_06';
          const stdout = execFileSync('npx', ['wrangler', 'd1', 'execute', db, '--remote', '--json', '--command', `select
              o.observation_id,
              o.owner_user_id,
              o.observed_at,
              a.asset_id,
              a.width,
              a.height,
              a.bytes,
              a.mime,
              a.processing_state,
              case when a.public_derivative_key is not null then 1 else 0 end as has_derivative,
              case when a.public_derivative_verified_at is not null then 1 else 0 end as derivative_verified,
              case when a.public_ready_at is not null then 1 else 0 end as public_ready,
              case when a.exif_scrub_state = 'scrubbed' then 1 else 0 end as exif_scrubbed,
              case when coalesce(a.width,0) = 320 and coalesce(a.height,0) = 240 and coalesce(a.bytes,0) > 0 and a.bytes <= 12000 then 1 else 0 end as excluded_placeholder_gate,
              case when coalesce(a.width,0) = 1 and coalesce(a.height,0) = 1 then 1 else 0 end as excluded_one_pixel
            from observations o
            join asset_ledger a on a.observation_id = o.observation_id
            where substr(o.observed_at,1,10) in ('2026-07-07','2026-07-10')
              and lower(coalesce(a.mime,'')) like 'image/%'
            order by o.observed_at desc, a.uploaded_at asc`], {
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          const rows = JSON.parse(stdout)[0]?.results ?? [];
          const hash = (value) => createHash('sha256').update(String(value ?? '')).digest('hex').slice(0, 12);
          const records = rows.map((row) => ({
            observedDate: String(row.observed_at).slice(0, 10),
            observationHash: hash(row.observation_id),
            ownerHash: hash(row.owner_user_id),
            assetHash: hash(row.asset_id),
            width: Number(row.width || 0),
            height: Number(row.height || 0),
            bytes: Number(row.bytes || 0),
            mime: String(row.mime || ''),
            processingState: String(row.processing_state || ''),
            hasDerivative: Boolean(Number(row.has_derivative)),
            derivativeVerified: Boolean(Number(row.derivative_verified)),
            publicReady: Boolean(Number(row.public_ready)),
            exifScrubbed: Boolean(Number(row.exif_scrubbed)),
            excludedByPlaceholderGate: Boolean(Number(row.excluded_placeholder_gate)),
            excludedAsOnePixel: Boolean(Number(row.excluded_one_pixel)),
          }));
          const report = {
            mode: 'read-only',
            assetCount: records.length,
            placeholderGateExcludedCount: records.filter((row) => row.excludedByPlaceholderGate).length,
            records,
            containsRawIdentifiers: false,
            productionMutated: false,
          };
          writeFileSync('photo-gate-production-diagnostic/report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: photo-gate-production-diagnostic
          path: platform_v2/cloudflare_shadow/photo-gate-production-diagnostic
          if-no-files-found: error
          retention-days: 7

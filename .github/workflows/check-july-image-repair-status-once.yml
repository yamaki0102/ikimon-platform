name: Check July Image Repair Status Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'agent/check-july-image-repair-status-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - run: npm --prefix platform_v2/cloudflare_shadow ci
      - name: Query sanitized status
        working-directory: platform_v2/cloudflare_shadow
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/july-image-repair-status"
          mkdir -p "$root"
          npx wrangler d1 execute ikimon_prod_core --env production --remote --json --command "SELECT user_id FROM auth_users WHERE lower(email)=lower('yamaki0102@gmail.com') LIMIT 1" > "$root/account.private.json"
          USER_ID="$(node -e "const x=require(process.argv[1]);process.stdout.write(x[0].results[0].user_id)" "$root/account.private.json")"
          npx wrangler d1 execute ikimon_prod_observations_2026_06 --env production --remote --json --command "SELECT o.observation_id,o.observed_at,a.asset_id,a.public_derivative_metadata_json,a.public_derivative_verified_at,a.exif_scrub_state,a.public_ready_at FROM observations o JOIN asset_ledger a ON a.observation_id=o.observation_id WHERE o.owner_user_id='$USER_ID' AND substr(o.observed_at,1,10) IN ('2026-07-07','2026-07-10') AND a.mime LIKE 'image/%' ORDER BY o.observed_at DESC,a.asset_id" > "$root/assets.private.json"
          npx wrangler d1 execute ikimon_prod_observations_2026_06 --env production --remote --json --command "SELECT outbox_id,target_id,dispatch_state,attempts,last_error,created_at,dispatched_at FROM outbox WHERE outbox_id LIKE 'repair-real-image-v3-%' ORDER BY created_at DESC" > "$root/outbox.private.json"
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');const root=process.env.GITHUB_WORKSPACE+'/july-image-repair-status';const hash=v=>crypto.createHash('sha256').update(String(v??'')).digest('hex').slice(0,12);const assets=JSON.parse(fs.readFileSync(root+'/assets.private.json','utf8'))[0]?.results??[];const outbox=JSON.parse(fs.readFileSync(root+'/outbox.private.json','utf8'))[0]?.results??[];const safeAssets=assets.map(r=>{let m={};try{m=JSON.parse(r.public_derivative_metadata_json??'{}')}catch{};return{observationHash:hash(r.observation_id),assetHash:hash(r.asset_id),observedDate:String(r.observed_at).slice(0,10),tool:m.tool??null,reason:m.reason??null,contentType:m.contentType??null,container:m.scannedContainer??null,gpsExifPresent:m.gpsExifPresent??null,verified:Boolean(r.public_derivative_verified_at),scrubState:r.exif_scrub_state,publicReady:Boolean(r.public_ready_at)};});const safeOutbox=outbox.map(r=>({outboxHash:hash(r.outbox_id),targetHash:hash(r.target_id),state:r.dispatch_state,attempts:Number(r.attempts||0),lastError:r.last_error?String(r.last_error).slice(0,240):null,createdAt:r.created_at,dispatchedAt:r.dispatched_at}));fs.writeFileSync(root+'/report.json',JSON.stringify({assets:safeAssets,outbox:safeOutbox},null,2));fs.rmSync(root+'/account.private.json');fs.rmSync(root+'/assets.private.json');fs.rmSync(root+'/outbox.private.json');
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: july-image-repair-status
          path: july-image-repair-status/report.json
          if-no-files-found: error
          retention-days: 3

name: Apply Record Fallback Recovery

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/record-fallback-recovery-20260712

permissions:
  contents: write

concurrency:
  group: apply-record-fallback-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/record-fallback-recovery-20260712' || github.ref_name == 'agent/record-fallback-recovery-20260712')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 0

      - name: Confirm focused implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD | tee /tmp/record-fallback-changed-files.txt
          grep -q '^platform_v2/src/routes/read.ts$' /tmp/record-fallback-changed-files.txt
          grep -q '^platform_v2/src/ui/siteShell.ts$' /tmp/record-fallback-changed-files.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Verify platform contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2 run build
          npm --prefix platform_v2 run test:node

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-record-fallback-recovery.yml
          rm -f .github/workflows/apply-record-fallback-recovery.yml
          rm -rf ops/patches/record-fallback-recovery
          rm -rf record-fallback-apply-diagnostic
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: finalize record fallback recovery implementation'
          git push origin HEAD:agent/record-fallback-recovery-20260712

name: Apply Record Fallback Recovery

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/record-fallback-recovery-20260712

permissions:
  contents: write

concurrency:
  group: apply-record-fallback-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/record-fallback-recovery-20260712' || github.ref_name == 'agent/record-fallback-recovery-20260712')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 0

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p record-fallback-apply-diagnostic
          : > /tmp/record-fallback-recovery.patch
          for chunk in ops/patches/record-fallback-recovery/chunk-*.b64; do
            printf 'decoding %s\n' "$chunk" | tee -a record-fallback-apply-diagnostic/apply.log
            base64 -d "$chunk" >> /tmp/record-fallback-recovery.patch
          done
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/record-fallback-recovery.patch')
          data = path.read_bytes()
          old = b"params.gett('start')"
          if data.count(old) != 1:
              raise SystemExit(f'expected one staged boundary duplication, found {data.count(old)}')
          path.write_bytes(data.replace(old, b"params.get('start')", 1))
          PY
          cp /tmp/record-fallback-recovery.patch record-fallback-apply-diagnostic/record-fallback-recovery.patch
          wc -c /tmp/record-fallback-recovery.patch | tee -a record-fallback-apply-diagnostic/apply.log
          sha256sum /tmp/record-fallback-recovery.patch | tee -a record-fallback-apply-diagnostic/apply.log
          printf '%s  %s\n' '927ce41348f77e34528bcd28e20045df23e8a39b85313d24706773fcdc727ffd' '/tmp/record-fallback-recovery.patch' | sha256sum -c - 2>&1 | tee -a record-fallback-apply-diagnostic/apply.log
          git apply --check --verbose /tmp/record-fallback-recovery.patch 2>&1 | tee -a record-fallback-apply-diagnostic/apply.log
          git apply --verbose /tmp/record-fallback-recovery.patch 2>&1 | tee -a record-fallback-apply-diagnostic/apply.log
          git diff --check 2>&1 | tee -a record-fallback-apply-diagnostic/apply.log

      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-fallback-apply-diagnostic
          path: record-fallback-apply-diagnostic
          if-no-files-found: warn
          retention-days: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Verify platform contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2 run build
          npm --prefix platform_v2 run test:node

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-record-fallback-recovery.yml
          rm -f .github/workflows/apply-record-fallback-recovery.yml
          rm -rf ops/patches/record-fallback-recovery
          rm -rf record-fallback-apply-diagnostic
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make record fallback a recovery workspace'
          git push origin HEAD:agent/record-fallback-recovery-20260712

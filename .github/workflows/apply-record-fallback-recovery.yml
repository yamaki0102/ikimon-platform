name: Apply Record Fallback Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-record-fallback-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/record-fallback-recovery-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-fallback-recovery-20260712
          fetch-depth: 0

      - name: Rebuild and apply focused implementation
        shell: bash
        run: |
          set -euo pipefail
          cat ops/patches/record-fallback-recovery.xz.b64.* \
            | base64 --decode \
            | xz --decompress \
            > /tmp/record-fallback-recovery.patch
          git apply --check --verbose /tmp/record-fallback-recovery.patch 2>&1 | tee record-fallback-apply.log
          git apply --verbose /tmp/record-fallback-recovery.patch 2>&1 | tee -a record-fallback-apply.log
          git diff --check

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Verify recovery contracts
        shell: bash
        run: |
          set -o pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2 run build
          (cd platform_v2 && npx tsx --test src/routes/record.routes.test.ts src/ui/siteShell.test.ts) 2>&1 | tee record-fallback-focused-test.log
          npm --prefix platform_v2 run test:node 2>&1 | tee record-fallback-node-test.log

      - name: Upload apply and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-fallback-recovery-apply-evidence
          path: |
            record-fallback-apply.log
            platform_v2/record-fallback-focused-test.log
            record-fallback-node-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-record-fallback-recovery.yml
          rm -f .github/workflows/apply-record-fallback-recovery.yml
          rm -f ops/patches/record-fallback-recovery.xz.b64.*
          rm -f record-fallback-apply.log record-fallback-node-test.log
          rm -f platform_v2/record-fallback-focused-test.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make record fallback a safe recovery flow'
          git push origin HEAD:agent/record-fallback-recovery-20260712

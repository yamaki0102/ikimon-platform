name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'platform_v2/**'
      - 'ops/deploy/**'
      - 'scripts/check_deploy_guardrails.ps1'
      - 'scripts/check_deploy_manifest_sync.ps1'
      - 'scripts/check_staging_manifest_sync.ps1'
      - 'scripts/check_platform_migration_guardrails.ps1'
      - 'scripts/check_legacy_entrypoint_reason.ps1'
      - 'scripts/classify_deploy_smoke_tier.ps1'
      - 'scripts/plan_production_release_scope.mjs'
      - 'scripts/run_cloudflare_production_release.sh'
      - 'scripts/verify_cloudflare_production_release.sh'
      - 'scripts/tests/production_release_scope.tests.mjs'
      - 'scripts/tests/release_automation.tests.ps1'
      - '.github/workflows/deploy.yml'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IKIMON_CF_PRODUCTION_DEPLOY_APPROVAL: APPROVE_IKIMON_CF_PRODUCTION_WORKER_DEPLOY
  IKIMON_PRODUCTION_WORKER: ikimon-life-cloudflare-prod
  IKIMON_PRODUCTION_R2_BUCKET: ikimon-prod-media
  IKIMON_PRODUCTION_WORKER_DIRECTORY: platform_v2/cloudflare_shadow

jobs:
  plan-and-guard:
    name: Plan and Guard Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      run_guardrails: ${{ steps.plan.outputs.run_guardrails }}
      smoke_tier: ${{ steps.plan.outputs.smoke_tier }}
      reason: ${{ steps.plan.outputs.reason }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve changed files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BEFORE_SHA}" ]] && ! grep -qE '^0+$' <<< "${BEFORE_SHA}" && git rev-parse --verify "${BEFORE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}" > production-release-changed-files.txt
          else
            git show --pretty='' --name-only "${HEAD_SHA}" > production-release-changed-files.txt
          fi
          sed '/^[[:space:]]*$/d' production-release-changed-files.txt | sort -u -o production-release-changed-files.txt
          cat production-release-changed-files.txt

      - name: Plan production release scope
        id: plan
        run: >-
          node scripts/plan_production_release_scope.mjs
          --changed-files production-release-changed-files.txt
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Test production release scope planner
        run: node --test scripts/tests/production_release_scope.tests.mjs

      - name: Run deploy control guardrails
        if: steps.plan.outputs.run_guardrails == 'true'
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          ./scripts/check_deploy_guardrails.ps1
          ./scripts/check_deploy_manifest_sync.ps1
          $resolvedBase = $env:BASE_REF
          if ([string]::IsNullOrWhiteSpace($resolvedBase) -or $resolvedBase -match '^0+$') {
            $resolvedBase = 'HEAD~1'
          }
          ./scripts/check_legacy_entrypoint_reason.ps1 -BaseRef $resolvedBase
          ./scripts/check_platform_migration_guardrails.ps1
          ./scripts/tests/release_automation.tests.ps1

  deploy-production:
    name: Deploy and Verify Cloudflare Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan-and-guard
    if: needs.plan-and-guard.outputs.deploy_required == 'true'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_PRODUCTION: 'true'
      TEST_PROFILE: quick
      SMOKE_TIER: ${{ needs.plan-and-guard.outputs.smoke_tier }}
      PLAYWRIGHT_INSTALL_WITH_DEPS: 'false'
      IKIMON_EXPECTED_GIT_SHA: ${{ github.sha }}
      IKIMON_WORKER_VERSION: github-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform_v2/package-lock.json
            platform_v2/cloudflare_shadow/package-lock.json

      - name: Configure Playwright browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${GITHUB_WORKSPACE}/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: production-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform_v2/package-lock.json') }}

      - name: Run portable production release
        run: bash scripts/run_cloudflare_production_release.sh

      - name: Write portable release summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'platform_v2/cloudflare_shadow/.deploy/production-release-summary.json';
          console.log('## Portable Cloudflare Production Release');
          console.log('');
          console.log('- Worker: `ikimon-life-cloudflare-prod`');
          console.log('- R2 bucket: `ikimon-prod-media`');
          console.log('- VPS SSH/deploy: `not used`');
          console.log('- GitHub Artifact handoff: `not used`');
          if (!fs.existsSync(path)) {
            console.log('- Release summary: `missing`');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`- Status: \`${report.status}\``);
          console.log(`- Git SHA: \`${report.gitSha}\``);
          console.log(`- Test profile: \`${report.testProfile}\``);
          console.log(`- Smoke tier: \`${report.smokeTier}\``);
          NODE

      - name: Upload production failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-release-failure-evidence
          path: |
            platform_v2/cloudflare_shadow/.deploy/production-preflight-latest.json
            platform_v2/cloudflare_shadow/.deploy/wrangler-version-cache.json
            platform_v2/cloudflare_shadow/.deploy/production-release-summary.json
            platform_v2/cloudflare_shadow/materialize-original-ui.json
            platform_v2/test-results
            platform_v2/playwright-report/observation-image-target
            platform_v2/playwright-report/observation-target
          if-no-files-found: ignore
          retention-days: 3

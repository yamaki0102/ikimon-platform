name: Patch Production PWA Version Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-production-pwa-version-check' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-production-pwa-version-check
          fetch-depth: 0
      - name: Update production PWA version expectation
        run: python scripts/patch-production-pwa-version-check.py
      - name: Remove temporary patch files
        shell: bash
        run: |
          rm .github/workflows/patch-production-pwa-version-check.yml
          rm scripts/patch-production-pwa-version-check.py
      - name: Commit synchronized production check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No PWA version synchronization changes to commit."
            exit 1
          fi
          git commit -m "fix: sync production PWA verification version"
          git push origin HEAD:agent/fix-production-pwa-version-check

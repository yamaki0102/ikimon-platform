name: Patch Production PWA Version Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch:
    if: github.head_ref == 'agent/fix-production-pwa-version-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-production-pwa-version-check
      - name: Update production PWA version expectation
        run: python scripts/patch-production-pwa-version-check.py
      - name: Validate patched workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ikimon-app-v7' .github/workflows/deploy.yml
          if grep -Fq 'ikimon-app-v6' .github/workflows/deploy.yml; then
            echo 'stale v6 marker remains'
            exit 1
          fi
      - name: Upload patched deploy workflow
        uses: actions/upload-artifact@v6
        with:
          name: patched-production-deploy-workflow
          path: .github/workflows/deploy.yml
          if-no-files-found: error
          retention-days: 2

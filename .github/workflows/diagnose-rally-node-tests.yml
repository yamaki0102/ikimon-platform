name: Diagnose Rally Node Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/rally-post-save-auto-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json
      - name: Install platform dependencies
        working-directory: platform_v2
        run: npm ci
      - name: Capture complete node test output
        id: tests
        working-directory: platform_v2
        shell: bash
        run: |
          set +e
          npm run test:node > node-test-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 node-test-diagnostic.log || true
          exit 0
      - name: Upload node test diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rally-node-test-diagnostic
          path: platform_v2/node-test-diagnostic.log
          if-no-files-found: error
      - name: Preserve failing status
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

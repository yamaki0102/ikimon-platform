name: Fix Owner Home Executor Command Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct targeted test commands
        shell: bash
        run: |
          set -euo pipefail
          path=.github/workflows/apply-owner-home-fix-once.yml
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-owner-home-fix-once.yml')
          text = path.read_text(encoding='utf-8')
          old_platform = '            npm --prefix platform_v2 exec -- tsx --test src/routes/pwa.routes.test.ts src/deployPwaVersionContract.test.ts'
          new_platform = '            (cd platform_v2 && npx tsx --test src/routes/pwa.routes.test.ts src/deployPwaVersionContract.test.ts)'
          old_worker = '            npm --prefix platform_v2/cloudflare_shadow exec -- tsx --test src/ownerHomeInjectionContract.test.ts'
          new_worker = '            (cd platform_v2/cloudflare_shadow && npx tsx --test src/ownerHomeInjectionContract.test.ts)'
          if text.count(old_platform) != 1 or text.count(old_worker) != 1:
              raise SystemExit(f'targets platform={text.count(old_platform)} worker={text.count(old_worker)}')
          path.write_text(text.replace(old_platform, new_platform, 1).replace(old_worker, new_worker, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "ci: fix owner home targeted test commands"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Diagnose Native Record Recovery Shadow

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/cloudflare-record-recovery-native-final-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cloudflare-record-recovery-native-final-20260712
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - run: git rm -f .github/workflows/diagnose-native-record-recovery-shadow.yml
      - shell: bash
        run: |
          set +e
          npm --prefix platform_v2/cloudflare_shadow ci
          npm --prefix platform_v2/cloudflare_shadow run deploy:shadow:preflight > native-shadow.log 2>&1
          echo $? > native-shadow-exit.txt
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: native-record-recovery-shadow-diagnostics
          path: |
            native-shadow.log
            native-shadow-exit.txt
            platform_v2/cloudflare_shadow/.deploy/shadow-preflight-latest.json
          retention-days: 3

name: Apply Mobile Map Progressive Controls

on:
  push:
    branches:
      - agent/mobile-map-progressive-controls-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-mobile-map-progressive
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mobile-map-progressive-controls-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mobile-map-progressive-controls-20260712
          fetch-depth: 0

      - name: Apply focused implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose ops/patches/mobile-map-progressive-controls.patch 2>&1 | tee mobile-map-patch.log
          git apply --verbose ops/patches/mobile-map-progressive-controls.patch 2>&1 | tee -a mobile-map-patch.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-map-patch-diagnostics
          path: mobile-map-patch.log
          if-no-files-found: warn
          retention-days: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Verify platform contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2 run build
          npm --prefix platform_v2 run test:node

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-mobile-map-progressive.yml
          rm -f .github/workflows/apply-mobile-map-progressive.yml
          rm -f ops/patches/mobile-map-progressive-controls.patch
          rm -f mobile-map-patch.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: simplify mobile map controls progressively'
          git push origin HEAD:agent/mobile-map-progressive-controls-20260712

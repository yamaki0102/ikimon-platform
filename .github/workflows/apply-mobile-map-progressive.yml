name: Apply Mobile Map Progressive Controls

on:
  push:
    branches:
      - agent/mobile-map-progressive-controls-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-mobile-map-progressive
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mobile-map-progressive-controls-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mobile-map-progressive-controls-20260712
          fetch-depth: 0

      - name: Apply focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python ops/apply_mobile_map_progressive.py
          git diff --check

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Verify focused map contracts
        shell: bash
        run: |
          set -o pipefail
          npm --prefix platform_v2 ci
          npm --prefix platform_v2 run typecheck
          (cd platform_v2 && npx tsx --test src/ui/mapExplorer.test.ts) 2>&1 | tee mobile-map-test.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-map-focused-test-log
          path: mobile-map-test.log
          if-no-files-found: warn
          retention-days: 2

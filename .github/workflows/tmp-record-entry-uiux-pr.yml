name: Temporary record entry UI patch on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/record-entry-uiux-20260710'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Apply focused UI and posting fix
        run: |
          python3 .github/scripts/apply-record-entry-uiux-patch.py
          python3 .github/scripts/adjust-record-entry-uiux-tests.py

      - name: Install dependencies
        working-directory: platform_v2
        run: npm ci

      - name: Typecheck
        working-directory: platform_v2
        run: npm run typecheck

      - name: Run focused shell tests
        id: focused-tests
        continue-on-error: true
        working-directory: platform_v2
        run: npx tsx --test src/ui/siteShell.test.ts > ../siteShell-test.log 2>&1

      - name: Upload focused test log
        if: steps.focused-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: siteShell-test-log
          path: siteShell-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit patch and remove temporary files
        if: steps.focused-tests.outcome == 'success'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "ikimon-ui-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-record-entry-uiux-pr.yml .github/scripts/apply-record-entry-uiux-patch.py .github/scripts/adjust-record-entry-uiux-tests.py
          git add platform_v2/src/ui/siteShell.ts platform_v2/src/ui/siteShell.test.ts
          git commit -m "fix(ui): keep mobile photo posts in the quick record flow"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Fail on focused test failure
        if: steps.focused-tests.outcome == 'failure'
        run: exit 1

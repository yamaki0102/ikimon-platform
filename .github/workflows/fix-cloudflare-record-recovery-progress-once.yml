      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json

      - name: Verify Cloudflare recovery progress
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix platform_v2/cloudflare_shadow ci
          npm --prefix platform_v2/cloudflare_shadow run check
          npm --prefix platform_v2/cloudflare_shadow test

      - name: Commit progress fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform_v2/cloudflare_shadow/src/recordRecoveryHtml.ts platform_v2/cloudflare_shadow/src/recordRecoveryHtml.test.ts
          git diff --cached --check
          git commit -m 'fix: persist record recovery upload progress'
          git push origin HEAD:agent/cloudflare-record-recovery-origin-fallback-20260712

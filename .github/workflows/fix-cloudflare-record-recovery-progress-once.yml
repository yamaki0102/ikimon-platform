name: Fix Cloudflare Record Recovery Progress Once

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: fix-cloudflare-record-recovery-progress-once
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/cloudflare-record-recovery-origin-fallback-20260712' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cloudflare-record-recovery-origin-fallback-20260712
          fetch-depth: 0

      - name: Persist retry target and media progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('platform_v2/cloudflare_shadow/src/recordRecoveryHtml.ts')
          source = path.read_text(encoding='utf-8')

          replacements = []
          replacements.append(('''    let recoveredFiles = [];
              let recoveryMetadata = {};
              let pendingRetryTarget = "";
          ''','''    let recoveredFiles = [];
              let recoveryMetadata = {};
              let currentDraft = null;
              let pendingRetryTarget = "";
              let completedPhotoIndexes = new Set();
              let pendingVideoUid = "";
              let pendingVideoUploadUrl = "";
              let pendingVideoBodyUploaded = false;
          '''))

          replacements.append(('''    async function readDraft() {
              const db = await openRecordDraftDb();
              try {
                return await new Promise((resolve, reject) => {
                  const tx = db.transaction("drafts", "readonly");

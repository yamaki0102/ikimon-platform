name: Verify Production Deployment

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: b4a711163dd2080acc97ff87e3179278a535077c
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify latest production deploy and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-deploy-verification
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > production-deploy-verification/runs.json
          node <<'NODE' > production-deploy-verification/deploy-run.json
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const payload = JSON.parse(fs.readFileSync('production-deploy-verification/runs.json', 'utf8'));
          const run = (payload.workflow_runs || []).find((item) => item.head_sha === expected);
          if (!run) throw new Error(`production_deploy_run_not_found:${expected}`);
          console.log(JSON.stringify({ id: run.id, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, html_url: run.html_url, run_number: run.run_number, created_at: run.created_at, updated_at: run.updated_at }, null, 2));
          if (run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`production_deploy_not_success:${run.status}:${run.conclusion || 'none'}`);
          }
          NODE
          for base in \
            "https://ikimon.life" \
            "https://ikimon-life-cloudflare-prod.yamaki0102.workers.dev"
          do
            safe="$(echo "$base" | tr -cs 'A-Za-z0-9' '_')"
            curl -fsSL --retry 4 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/api/v1/runtime/version" > "production-deploy-verification/${safe}_runtime.json"
            curl -fsSL --retry 4 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/healthz" > "production-deploy-verification/${safe}_health.json"
            curl -fsSL --retry 4 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/readyz" > "production-deploy-verification/${safe}_ready.json"
          done
          node <<'NODE' > production-deploy-verification/runtime-summary.json
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const files = fs.readdirSync('production-deploy-verification').filter((name) => name.endsWith('_runtime.json'));
          const runtimes = files.map((name) => ({ name, payload: JSON.parse(fs.readFileSync(`production-deploy-verification/${name}`, 'utf8')) }));
          for (const item of runtimes) {
            if (item.payload.gitSha !== expected) throw new Error(`runtime_sha_mismatch:${item.name}:${item.payload.gitSha}:${expected}`);
            if (item.payload.ok !== true || item.payload.runtime !== 'cloudflare-worker') throw new Error(`runtime_contract_failed:${item.name}`);
          }
          console.log(JSON.stringify({ expectedSha: expected, runtimes }, null, 2));
          NODE
      - name: Upload production deploy verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-verification
          path: production-deploy-verification
          if-no-files-found: warn
          retention-days: 7

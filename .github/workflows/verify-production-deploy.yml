name: Verify Production Deployment

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/production-smoke-cleanup'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 8ae5ddc6db72ba1d7f9b882195e4c879898ac2be
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify latest production deploy and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-deploy-verification
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30"
          deploy_ready=0
          for attempt in $(seq 1 80); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > production-deploy-verification/runs.json
            state="$(node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const payload = JSON.parse(fs.readFileSync('production-deploy-verification/runs.json', 'utf8'));
          const run = (payload.workflow_runs || []).find((item) => item.head_sha === expected);
          if (!run) {
            process.stdout.write('missing|||');
          } else {
            fs.writeFileSync('production-deploy-verification/deploy-run.json', `${JSON.stringify({ id: run.id, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, html_url: run.html_url, run_number: run.run_number, created_at: run.created_at, updated_at: run.updated_at }, null, 2)}\n`);
            process.stdout.write(`${run.status}|${run.conclusion || ''}|${run.id}|${run.html_url}`);
          }
          NODE
            )"
            IFS='|' read -r status conclusion run_id run_url <<< "$state"
            echo "deploy attempt ${attempt}: status=${status} conclusion=${conclusion:-none} run=${run_id:-none}"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              deploy_ready=1
              break
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "Production deploy failed: ${run_url:-unknown}"
              exit 1
            fi
            sleep 15
          done
          if [ "$deploy_ready" -ne 1 ]; then
            echo "Production deploy did not complete within the verification window."
            exit 1
          fi
          for base in \
            "https://ikimon.life" \
            "https://ikimon-life-cloudflare-prod.yamaki0102.workers.dev"
          do
            safe="$(echo "$base" | tr -cs 'A-Za-z0-9' '_')"
            curl -fsSL --retry 8 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/api/v1/runtime/version" > "production-deploy-verification/${safe}_runtime.json"
            curl -fsSL --retry 8 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/healthz" > "production-deploy-verification/${safe}_health.json"
            curl -fsSL --retry 8 --retry-delay 5 -H 'accept: application/json' -H 'cache-control: no-store' "$base/readyz" > "production-deploy-verification/${safe}_ready.json"
          done
          node <<'NODE' > production-deploy-verification/runtime-summary.json
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const files = fs.readdirSync('production-deploy-verification').filter((name) => name.endsWith('_runtime.json'));
          const runtimes = files.map((name) => ({ name, payload: JSON.parse(fs.readFileSync(`production-deploy-verification/${name}`, 'utf8')) }));
          for (const item of runtimes) {
            if (item.payload.gitSha !== expected) throw new Error(`runtime_sha_mismatch:${item.name}:${item.payload.gitSha}:${expected}`);
            if (item.payload.ok !== true || item.payload.runtime !== 'cloudflare-worker') throw new Error(`runtime_contract_failed:${item.name}`);
          }
          console.log(JSON.stringify({ expectedSha: expected, runtimes }, null, 2));
          NODE
      - name: Upload production deploy verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-verification
          path: production-deploy-verification
          if-no-files-found: warn
          retention-days: 7

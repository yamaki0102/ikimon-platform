name: Verify Current Production Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-current-production-release
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.head_ref == 'agent/verify-record-recovery-production-final-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: cff8c6a25de27ef7ddd81b6d92c6cca9cd537722
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://ikimon.life
    steps:
      - name: Wait for the target production deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-production-verification
          repo="$GITHUB_REPOSITORY"
          found=""
          for attempt in $(seq 1 80); do
            gh api --paginate "repos/$repo/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=100" \
              > current-production-verification/runs.json
            run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' current-production-verification/runs.json | head -1)"
            if [ -n "$run_id" ]; then
              gh api "repos/$repo/actions/runs/$run_id" > current-production-verification/run.json
              status="$(jq -r '.status' current-production-verification/run.json)"
              conclusion="$(jq -r '.conclusion // empty' current-production-verification/run.json)"
              echo "deploy run=$run_id status=$status conclusion=${conclusion:-pending}"
              printf '%s\n' "$run_id" > current-production-verification/run-id.txt
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                found="yes"
                break
              fi
            else
              echo "deploy run for $TARGET_SHA is not visible yet (attempt $attempt)"
            fi
            sleep 15
          done
          test "$found" = "yes"
          run_id="$(cat current-production-verification/run-id.txt)"
          gh api "repos/$repo/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            > current-production-verification/jobs.json
          jq -e '.jobs[] | select(.name == "Deploy and Verify Cloudflare Production" and .conclusion == "success")' \
            current-production-verification/jobs.json >/dev/null
          job_id="$(jq -r '.jobs[] | select(.name == "Deploy and Verify Cloudflare Production") | .id' current-production-verification/jobs.json | head -1)"
          test -n "$job_id"
          gh api "repos/$repo/actions/jobs/$job_id/logs" > current-production-verification/deploy-job.log || true
          tail -n 500 current-production-verification/deploy-job.log \
            > current-production-verification/deploy-job-tail.log || true

      - name: Wait for exact runtime identity
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL%/}"
          matched=""
          for attempt in $(seq 1 60); do
            status="$(curl -sS -L --connect-timeout 10 --max-time 30 \
              -H 'cache-control: no-store, no-cache' \
              -A 'ikimon-production-readonly-verification/2.0' \
              -D current-production-verification/runtime-version.headers \
              -o current-production-verification/runtime-version.body \
              -w '%{http_code}' \
              "$base/api/v1/runtime/version?verify=$GITHUB_RUN_ID")"
            runtime_sha="$(jq -r '.gitSha // empty' current-production-verification/runtime-version.body 2>/dev/null || true)"
            echo "runtime attempt=$attempt status=$status sha=${runtime_sha:-missing}"
            if [ "$status" = "200" ] && [ "$runtime_sha" = "$TARGET_SHA" ]; then
              matched="yes"
              break
            fi
            sleep 10
          done
          test "$matched" = "yes"

      - name: Verify health, mobile owner-card contract, PWA refresh, and recovery route
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL%/}"
          fetch() {
            local name="$1"
            local route="$2"
            local status
            status="$(curl -sS -L --connect-timeout 10 --max-time 30 \
              -H 'cache-control: no-store, no-cache' \
              -A 'ikimon-production-readonly-verification/2.0' \
              -D "current-production-verification/${name}.headers" \
              -o "current-production-verification/${name}.body" \
              -w '%{http_code}' \
              "$base$route")"
            printf '%s\n' "$status" > "current-production-verification/${name}.status"
            test "$status" = "200"
          }
          fetch health '/healthz'
          fetch ready '/readyz'
          fetch home '/ja/?production_verify=1'
          fetch app-sw '/app-sw.js?production_verify=1'
          fetch recovery '/ja/record?draft=1&start=photo&source=login_required&production_verify=1'
          grep -Fq 'id="prototype-guest-home-heading"' current-production-verification/home.body
          grep -Fq 'grid-template-columns:124px minmax(0,1fr);min-height:136px' current-production-verification/home.body
          grep -Fq 'margin-bottom:calc(120px + env(safe-area-inset-bottom))' current-production-verification/home.body
          grep -Fq '.prototype-record-feed.is-owner .prototype-record-feed-copy{position:static' current-production-verification/home.body
          grep -Fq "ikimon-app-v7" current-production-verification/app-sw.body
          ! grep -Fq 'SHELL_CACHE' current-production-verification/app-sw.body
          grep -Fq '写真・入力内容はこの端末に残っています' current-production-verification/recovery.body
          grep -Fq 'ログインして続ける' current-production-verification/recovery.body
          grep -Fq '登録して続ける' current-production-verification/recovery.body
          {
            echo "target_sha=$TARGET_SHA"
            echo "runtime_sha=$(jq -r '.gitSha' current-production-verification/runtime-version.body)"
            echo "health_status=$(cat current-production-verification/health.status)"
            echo "ready_status=$(cat current-production-verification/ready.status)"
            echo "home_status=$(cat current-production-verification/home.status)"
            echo "app_sw_status=$(cat current-production-verification/app-sw.status)"
            echo "recovery_status=$(cat current-production-verification/recovery.status)"
            echo "owner_mobile_card_contract=true"
            echo "launcher_clearance_contract=true"
            echo "pwa_version=v7"
            echo "shared_shell_cache_absent=true"
          } | tee current-production-verification/summary.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: current-production-verification
          path: current-production-verification
          if-no-files-found: error
          retention-days: 14

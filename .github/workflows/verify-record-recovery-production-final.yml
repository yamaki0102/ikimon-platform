name: Verify Final Record Recovery Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-final-record-recovery-production
  cancel-in-progress: true

jobs:
  diagnose-production:
    if: github.head_ref == 'agent/verify-record-recovery-production-final-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 34fa5fa7446819bfedefec5ff20533a3e72523fa
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://ikimon.life
    steps:
      - name: Capture production run and full failed job log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p record-recovery-production-final-diagnostics
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=100" > record-recovery-production-final-diagnostics/runs.json
          run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' record-recovery-production-final-diagnostics/runs.json | head -1)"
          test -n "$run_id"
          printf '%s\n' "$run_id" > record-recovery-production-final-diagnostics/run-id.txt
          gh api "repos/$repo/actions/runs/$run_id/jobs?filter=latest&per_page=100" > record-recovery-production-final-diagnostics/jobs.json
          job_id="$(jq -r '.jobs[] | select(.name == "Deploy and Verify Cloudflare Production") | .id' record-recovery-production-final-diagnostics/jobs.json | head -1)"
          test -n "$job_id"
          printf '%s\n' "$job_id" > record-recovery-production-final-diagnostics/job-id.txt
          gh api "repos/$repo/actions/jobs/$job_id/logs" > record-recovery-production-final-diagnostics/deploy-job.log || true
          grep -nEi 'error|failed|failure|exit code|verification|smoke|wrangler|deploy' record-recovery-production-final-diagnostics/deploy-job.log > record-recovery-production-final-diagnostics/error-lines.txt || true
          tail -n 500 record-recovery-production-final-diagnostics/deploy-job.log > record-recovery-production-final-diagnostics/deploy-job-tail.log || true

      - name: Capture current public production state
        shell: bash
        run: |
          set +e
          base="${PRODUCTION_BASE_URL%/}"
          for spec in \
            'runtime-version|/api/v1/runtime/version' \
            'health|/healthz' \
            'ready|/readyz' \
            'recovery-guest|/ja/record?draft=1&start=photo&source=login_required' \
            'record-normal|/ja/record'
          do
            name="${spec%%|*}"
            route="${spec#*|}"
            curl -sS -L --connect-timeout 10 --max-time 30 \
              -H 'cache-control: no-store' \
              -A 'ikimon-production-readonly-diagnostics/1.0' \
              -D "record-recovery-production-final-diagnostics/${name}.headers" \
              -o "record-recovery-production-final-diagnostics/${name}.body" \
              -w '%{http_code}\n' \
              "$base$route" > "record-recovery-production-final-diagnostics/${name}.status"
          done
          {
            echo "target_sha=$TARGET_SHA"
            echo "runtime_status=$(cat record-recovery-production-final-diagnostics/runtime-version.status)"
            echo "runtime_sha=$(jq -r '.gitSha // empty' record-recovery-production-final-diagnostics/runtime-version.body 2>/dev/null)"
            echo "health_status=$(cat record-recovery-production-final-diagnostics/health.status)"
            echo "ready_status=$(cat record-recovery-production-final-diagnostics/ready.status)"
            echo "recovery_status=$(cat record-recovery-production-final-diagnostics/recovery-guest.status)"
            echo "recovery_draft_retained=$(grep -Fq '写真・入力内容はこの端末に残っています' record-recovery-production-final-diagnostics/recovery-guest.body && echo true || echo false)"
            echo "recovery_login=$(grep -Fq 'ログインして続ける' record-recovery-production-final-diagnostics/recovery-guest.body && echo true || echo false)"
            echo "recovery_register=$(grep -Fq '登録して続ける' record-recovery-production-final-diagnostics/recovery-guest.body && echo true || echo false)"
            echo "normal_status=$(cat record-recovery-production-final-diagnostics/record-normal.status)"
          } > record-recovery-production-final-diagnostics/public-summary.txt
          cat record-recovery-production-final-diagnostics/public-summary.txt

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-recovery-production-final-diagnostics
          path: record-recovery-production-final-diagnostics
          if-no-files-found: error
          retention-days: 14

name: Fix Mobile Map Filter Scope

on:
  push:
    branches:
      - agent/mobile-map-progressive-controls-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-mobile-map-filter-scope
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mobile-map-progressive-controls-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mobile-map-progressive-controls-20260712
          fetch-depth: 0

      - name: Apply scope correction
        run: |
          set -euo pipefail
          python ops/fix_mobile_map_filter_scope.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          source = Path('platform_v2/src/ui/mapExplorer.ts').read_text(encoding='utf-8')
          assert "var mapShellEl = root.closest('.me-section') || root.parentElement;" in source
          assert "if (mapShellEl) mapShellEl.classList.toggle('me-filter-open', open);" in source
          assert "if (mapShellEl) mapShellEl.classList.remove('me-filter-open');" in source
          PY

      - name: Commit correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mobile-map-filter-scope.yml
          rm -f ops/fix_mobile_map_filter_scope.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope mobile map filter state to shell'
          git push origin HEAD:agent/mobile-map-progressive-controls-20260712

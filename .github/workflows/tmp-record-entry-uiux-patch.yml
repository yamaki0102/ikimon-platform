name: Temporary record entry UI patch

on:
  push:
    branches:
      - fix/record-entry-uiux-20260710
    paths:
      - .github/workflows/tmp-record-entry-uiux-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/record-entry-uiux-20260710
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform_v2/package-lock.json

      - name: Apply focused UI and posting fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path('platform_v2/src/ui/siteShell.ts')
          test_path = Path('platform_v2/src/ui/siteShell.test.ts')
          source = shell_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          def replace_exact(text: str, old: str, new: str, *, expected: int = 1, label: str) -> str:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {actual}')
              return text.replace(old, new)

          source = replace_exact(
              source,
              "  let directPostInFlight = false;\n  let photoDraftRetryDetailId = '';",
              "  let directPostInFlight = false;\n  let latestCaptureLocation = null;\n  let captureLocationRequest = null;\n  let photoDraftRetryDetailId = '';",
              label='capture location state',
          )

          source = replace_exact(
              source,
              '  const recordHref = escapeHtml(appendLangToHref(withBasePath(basePath, "/record"), lang));',
              '  const recordHref = escapeHtml(appendLangToHref(withBasePath(basePath, "/record?start=photo"), lang));',
              label='header record fallback href',
          )

          source = replace_exact(
              source,
              '    { key: "record", href: "/record", match: ["/record"] },\n',
              '',
              label='remove duplicate side-nav record entry',
          )

          source = replace_exact(
              source,
              '<a class="btn btn-solid site-record-link" href="${recordHref}">${escapeHtml(copy.record)}</a>',
              '<a class="btn btn-solid site-record-link" href="${recordHref}" data-global-record-trigger="photo" data-record-target="${recordHref}" data-kpi-action="header_record_photo">${escapeHtml(copy.record)}</a>',
              expected=4,
              label='header record launchers',
          )

          source = replace_exact(
              source,
              "  const durationSince = (startedAt) => Math.max(0, Math.round(nowMs() - Number(startedAt || 0)));\n  const sendGlobalRecordKpi = (metricName, durationMs, metadata) => {",
              """  const durationSince = (startedAt) => Math.max(0, Math.round(nowMs() - Number(startedAt || 0)));
  const requestCaptureLocation = () => {
    if (latestCaptureLocation) return Promise.resolve(latestCaptureLocation);
    if (captureLocationRequest) return captureLocationRequest;
    if (!(navigator.geolocation && typeof navigator.geolocation.getCurrentPosition === 'function')) {
      return Promise.resolve(null);
    }
    captureLocationRequest = new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latitude = Number(position && position.coords && position.coords.latitude);
          const longitude = Number(position && position.coords && position.coords.longitude);
          latestCaptureLocation = Number.isFinite(latitude) && Number.isFinite(longitude)
            ? { latitude, longitude, accuracy: Number(position.coords.accuracy) || null }
            : null;
          resolve(latestCaptureLocation);
        },
        () => resolve(null),
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 },
      );
    }).finally(() => {
      captureLocationRequest = null;
    });
    return captureLocationRequest;
  };
  const sendGlobalRecordKpi = (metricName, durationMs, metadata) => {""",
              label='capture location request helper',
          )

          source = replace_exact(
              source,
              """    setStatus(kind === 'photo' && options && options.reviewOnly ? '写真を確認しています。追加撮影してから記録へ進めます。' : 'カメラを起動しています...');
    if (!(options && options.reviewOnly)) void startCamera();""",
              """    setStatus(kind === 'photo' && options && options.reviewOnly ? '写真を確認しています。追加撮影してから記録へ進めます。' : 'カメラを起動しています...');
    if (kind === 'photo') void requestCaptureLocation();
    if (!(options && options.reviewOnly)) void startCamera();""",
              label='request location on photo sheet open',
          )

          source = replace_exact(
              source,
              """  const buildCaptureMetadata = () => ({
    capturedAt: new Date().toISOString(),
    location: null,
    locationPending: true,
  });""",
              """  const buildCaptureMetadata = () => ({
    capturedAt: new Date().toISOString(),
    location: latestCaptureLocation,
    locationPending: !latestCaptureLocation,
  });""",
              label='capture metadata location',
          )

          source = replace_exact(
              source,
              """    const metadata = capturedReviewMeta || {};
    if (!photoDraftRetryDetailId && !photoDraftRetryVisitId && !(metadata.location && Number.isFinite(Number(metadata.location.latitude)) && Number.isFinite(Number(metadata.location.longitude)))) {
      setStatus('地点を確認してから記録します。記録画面で場所を選べます。');
      await navigateWithDraft(files, 'photo', metadata);
      return;
    }""",
              """    const metadata = capturedReviewMeta || {};
    if (!photoDraftRetryDetailId && !photoDraftRetryVisitId && !(metadata.location && Number.isFinite(Number(metadata.location.latitude)) && Number.isFinite(Number(metadata.location.longitude)))) {
      setStatus('撮影地点を確認しています...');
      const resolvedLocation = metadata.location || await requestCaptureLocation();
      if (resolvedLocation) {
        metadata.location = resolvedLocation;
        metadata.locationPending = false;
      }
    }
    if (!photoDraftRetryDetailId && !photoDraftRetryVisitId && !(metadata.location && Number.isFinite(Number(metadata.location.latitude)) && Number.isFinite(Number(metadata.location.longitude)))) {
      setStatus('位置情報を取得できなかったため、写真を保持して記録画面へ移動します。');
      await navigateWithDraft(files, 'photo', metadata);
      return;
    }""",
              label='resolve location before direct post',
          )

          source = replace_exact(
              source,
              """        if (message === 'session_required') setStatus('記録するにはログインが必要です。ログイン後にもう一度試してください。');
        else if (message === 'location_required') setStatus('直接記録には地点が必要です。位置情報を許可してからもう一度試してください。');""",
              """        if (message === 'session_required') {
          setStatus('ログイン後に続けられるよう、写真を下書きに保存しています...');
          await navigateWithDraft(selectedPhotoDraftFiles(), 'photo', capturedReviewMeta || {});
          return;
        } else if (message === 'location_required') setStatus('直接記録には地点が必要です。位置情報を許可してからもう一度試してください。');""",
              label='preserve draft through login',
          )

          source = replace_exact(
              source,
              """    button.addEventListener('click', () => {
      const kind = button.getAttribute('data-global-record-trigger') || 'gallery';""",
              """    button.addEventListener('click', (event) => {
      event.preventDefault();
      const kind = button.getAttribute('data-global-record-trigger') || 'gallery';""",
              label='header launcher prevent navigation',
          )

          tests = replace_exact(
              tests,
              "  assert.match(html, /window\\.ikimonAppOutbox/);",
              """  assert.match(html, /window\\.ikimonAppOutbox/);
  assert.match(html, /class=\"btn btn-solid site-record-link\" href=\"\\/ja\\/record\\?start=photo\" data-global-record-trigger=\"photo\" data-record-target=\"\\/ja\\/record\\?start=photo\"/);
  assert.doesNotMatch(html, /class=\"desktop-side-nav-link[^\"]*\" href=\"\\/ja\\/record(?:\\?|\")/);
  assert.match(html, /navigator\\.geolocation\\.getCurrentPosition/);
  assert.match(html, /location: latestCaptureLocation,/);
  assert.match(html, /const resolvedLocation = metadata\\.location \\|\\| await requestCaptureLocation\\(\\);/);
  assert.match(html, /button\\.addEventListener\\('click', \\(event\\) => \\{\\s+event\\.preventDefault\\(\\);/);""",
              label='site shell regression assertions',
          )

          shell_path.write_text(source, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: platform_v2
        run: npm ci

      - name: Typecheck
        working-directory: platform_v2
        run: npm run typecheck

      - name: Run focused shell tests
        working-directory: platform_v2
        run: npx tsx --test src/ui/siteShell.test.ts

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ikimon-ui-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-record-entry-uiux-patch.yml
          git add platform_v2/src/ui/siteShell.ts platform_v2/src/ui/siteShell.test.ts
          git commit -m "fix(ui): keep mobile photo posts in the quick record flow"
          git push origin HEAD:fix/record-entry-uiux-20260710

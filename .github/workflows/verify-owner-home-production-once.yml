name: Verify Owner Home Production Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-owner-home-production-once
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'agent/verify-owner-home-production-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: 78f3bb787fe1739cf2f3fcc0cef39187d112ed70
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://ikimon.life
    steps:
      - name: Wait for exact production deploy success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-home-production-verification
          repo="$GITHUB_REPOSITORY"
          run_id=""
          for attempt in $(seq 1 100); do
            gh api --paginate "repos/$repo/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=100" \
              > owner-home-production-verification/runs.json
            run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' owner-home-production-verification/runs.json | head -1)"
            if [ -n "$run_id" ]; then
              gh api "repos/$repo/actions/runs/$run_id" > owner-home-production-verification/run.json
              status="$(jq -r '.status' owner-home-production-verification/run.json)"
              conclusion="$(jq -r '.conclusion // empty' owner-home-production-verification/run.json)"
              echo "attempt=$attempt run=$run_id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                break
              fi
            else
              echo "attempt=$attempt deploy run not visible"
            fi
            sleep 15
          done
          test -n "$run_id"
          test "$(jq -r '.status' owner-home-production-verification/run.json)" = "completed"
          test "$(jq -r '.conclusion' owner-home-production-verification/run.json)" = "success"
          gh api "repos/$repo/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            > owner-home-production-verification/jobs.json
          jq -e '.jobs[] | select(.name == "Deploy and Verify Cloudflare Production" and .conclusion == "success")' \
            owner-home-production-verification/jobs.json >/dev/null

      - name: Verify runtime identity and public contracts
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL%/}"
          runtime_ok=""
          for attempt in $(seq 1 60); do
            runtime_status="$(curl -sS -L --connect-timeout 10 --max-time 30 \
              -H 'cache-control: no-store, no-cache' \
              -A 'ikimon-owner-home-production-verifier/1.0' \
              -D owner-home-production-verification/runtime.headers \
              -o owner-home-production-verification/runtime.json \
              -w '%{http_code}' \
              "$base/api/v1/runtime/version?verify=$GITHUB_RUN_ID-$attempt")"
            runtime_sha="$(jq -r '.gitSha // empty' owner-home-production-verification/runtime.json 2>/dev/null || true)"
            echo "runtime attempt=$attempt status=$runtime_status sha=${runtime_sha:-missing}"
            if [ "$runtime_status" = "200" ] && [ "$runtime_sha" = "$TARGET_SHA" ]; then
              runtime_ok="yes"
              break
            fi
            sleep 10
          done
          test "$runtime_ok" = "yes"

          fetch_200() {
            local name="$1"
            local route="$2"
            local status
            status="$(curl -sS -L --connect-timeout 10 --max-time 30 \
              -H 'cache-control: no-store, no-cache' \
              -A 'ikimon-owner-home-production-verifier/1.0' \
              -D "owner-home-production-verification/${name}.headers" \
              -o "owner-home-production-verification/${name}.body" \
              -w '%{http_code}' \
              "$base$route")"
            printf '%s\n' "$status" > "owner-home-production-verification/${name}.status"
            test "$status" = "200"
          }

          fetch_200 health '/healthz'
          fetch_200 ready '/readyz'
          fetch_200 home '/ja/?verify_owner_home=1'
          fetch_200 app_sw '/app-sw.js?verify_owner_home=1'

          grep -Fq 'ikimon-app-v8' owner-home-production-verification/app_sw.body
          ! grep -Fq 'SHELL_CACHE' owner-home-production-verification/app_sw.body
          grep -Fq '@media(max-width:900px)' owner-home-production-verification/home.body
          grep -Fq 'prototype-record-feed.is-owner .prototype-record-feed-main{display:grid;grid-template-columns:124px' owner-home-production-verification/home.body
          grep -Fq 'body[data-owner-home-state-v2] .global-record-choice{min-height:50px' owner-home-production-verification/home.body

          {
            echo "target_sha=$TARGET_SHA"
            echo "runtime_sha=$(jq -r '.gitSha' owner-home-production-verification/runtime.json)"
            echo "health_status=$(cat owner-home-production-verification/health.status)"
            echo "ready_status=$(cat owner-home-production-verification/ready.status)"
            echo "home_status=$(cat owner-home-production-verification/home.status)"
            echo "app_sw_status=$(cat owner-home-production-verification/app_sw.status)"
            echo "service_worker_version=v8"
            echo "owner_state_css_present=true"
            echo "owner_grid_css_present=true"
            echo "owner_launcher_compact_css_present=true"
            echo "production_mutated_by_verifier=false"
          } | tee owner-home-production-verification/summary.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owner-home-production-verification
          path: owner-home-production-verification
          if-no-files-found: error
          retention-days: 7

name: Apply Owner Home Fix Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-owner-home-fix-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-owner-home-live-visual-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform_v2/package-lock.json
            platform_v2/cloudflare_shadow/package-lock.json

      - name: Apply owner-state, mobile layout, launcher, and PWA refresh fixes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-home-apply-evidence
          python <<'PY' 2>&1 | tee owner-home-apply-evidence/apply.log
          from pathlib import Path
          import re

          index_path = Path('platform_v2/cloudflare_shadow/src/index.ts')
          index = index_path.read_text(encoding='utf-8')
          marker = 'data-owner-home-state-v2'
          changed = False

          if marker not in index:
              matching_lines = [line for line in index.splitlines() if 'next = next.replace(/class="prototype-record-feed(?!' in line]
              if len(matching_lines) != 1:
                  raise SystemExit(f'owner feed class line count={len(matching_lines)}')
              old_class = matching_lines[0]
              new_class = '''  next = next.replace(/class="([^\"]*\\bprototype-record-feed\\b[^\"]*)"/, (_match, classes: string) => {
            const normalized = classes
              .split(/\\s+/)
              .filter((className) => className && className !== "is-owner" && className !== "is-guest");
            normalized.push(isOwnerFeed ? "is-owner" : "is-guest");
            return `class="${normalized.join(" ")}"`;
          });
          if (isOwnerFeed) {
            next = next.replace(/<body\\b([^>]*)>/i, (_match, attributes: string) => {
              if (/\\bdata-owner-home-state-v2\\b/.test(attributes)) return _match;
              return `<body${attributes} data-owner-home-state-v2>`;
            });
          }'''
              index = index.replace(old_class, new_class, 1)

              lines = index.splitlines()
              media_candidates = []
              for line_index, line in enumerate(lines):
                  window = '\n'.join(lines[line_index:line_index + 8])
                  if '@media(max-width:640px){' in line and 'prototype-record-feed.is-owner{margin-bottom:calc(120px' in window:
                      media_candidates.append(line_index)
              if len(media_candidates) != 1:
                  raise SystemExit(f'owner mobile CSS block count={len(media_candidates)}')
              start = media_candidates[0]
              expected = [
                  '@media(max-width:640px){',
                  '.prototype-record-feed.is-guest,.prototype-record-feed.is-owner{margin-top:4px}',
                  '.prototype-record-feed.is-guest .prototype-record-feed-media-wrap{height:48vh;min-height:320px}',
                  '.prototype-record-feed.is-owner{margin-bottom:calc(120px + env(safe-area-inset-bottom))}',
              ]
              for offset, needle in enumerate(expected):
                  if needle not in lines[start + offset]:
                      raise SystemExit(f'owner mobile CSS line {offset} did not match: {lines[start + offset]}')
              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              replacement = [
                  indent + '@media(max-width:900px){',
                  indent + '  .prototype-record-feed.is-guest,.prototype-record-feed.is-owner{margin-top:4px}',
                  indent + '  .prototype-record-feed.is-guest .prototype-record-feed-media-wrap{height:48vh;min-height:320px}',
                  indent + '  .prototype-record-feed.is-owner{margin-bottom:calc(88px + env(safe-area-inset-bottom))}',
                  indent + '  body[data-owner-home-state-v2] .site-shell{padding-bottom:calc(84px + max(0px,env(safe-area-inset-bottom)))}',
                  indent + '  body[data-owner-home-state-v2] .global-record-launcher{left:8px;right:8px;bottom:max(6px,env(safe-area-inset-bottom));gap:4px;padding:5px;border-radius:18px}',
                  indent + '  body[data-owner-home-state-v2] .global-record-choice{min-height:50px;gap:2px;padding:4px 3px;border-radius:13px;font-size:10px}',
                  indent + '  body[data-owner-home-state-v2] .global-record-choice-icon{width:24px;height:24px;flex-basis:24px}',
                  indent + '  body[data-owner-home-state-v2] .global-record-choice svg{width:15px;height:15px}',
              ]
              lines[start:start + 4] = replacement
              index = '\n'.join(lines) + ('\n' if index.endswith('\n') else '')

              grid_lines = [line for line in index.splitlines() if '.prototype-record-feed.is-owner .prototype-record-feed-main{grid-template-columns:124px' in line]
              if len(grid_lines) != 1:
                  raise SystemExit(f'owner grid line count={len(grid_lines)}')
              index = index.replace(
                  grid_lines[0],
                  grid_lines[0].replace('{grid-template-columns:', '{display:grid;grid-template-columns:'),
                  1,
              )
              index_path.write_text(index, encoding='utf-8')
              changed = True

              contract_path = Path('platform_v2/cloudflare_shadow/src/ownerHomeInjectionContract.test.ts')
              contract_path.write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync(new URL("./index.ts", import.meta.url), "utf8");

          test("owner home replaces a materialized guest feed state", () => {
            assert.match(source, /const normalized = classes/);
            assert.match(source, /className !== "is-owner" && className !== "is-guest"/);
            assert.match(source, /normalized\.push\(isOwnerFeed \? "is-owner" : "is-guest"\)/);
            assert.doesNotMatch(source, /class="prototype-record-feed\(\?!/);
            assert.match(source, /data-owner-home-state-v2/);
          });

          test("owner home cards and launcher use the full mobile shell range", () => {
            assert.match(source, /@media\(max-width:900px\)/);
            assert.match(source, /prototype-record-feed\.is-owner \.prototype-record-feed-main\{display:grid;grid-template-columns:124px/);
            assert.match(source, /body\[data-owner-home-state-v2\] \.global-record-choice\{min-height:50px/);
          });
          ''', encoding='utf-8')

          app_path = Path('platform_v2/src/appInstall.ts')
          app = app_path.read_text(encoding='utf-8')
          if 'ikimon-app-v8' not in app:
              if app.count('ikimon-app-v7') != 1:
                  raise SystemExit(f'PWA version target count={app.count("ikimon-app-v7")}')
              app = app.replace('ikimon-app-v7', 'ikimon-app-v8')
              app, personal_count = re.subn(
                  r'^const PERSONAL_NAV_RE = .*?;$',
                  r'const PERSONAL_NAV_RE = /^\\/(?:ja|en|es|pt-br)?\\/?(?:$|home\\/?$|profile(?:\\/settings)?\\/?$|settings\\/?$|records\\/?$|record\\/?$)/;',
                  app,
                  count=1,
                  flags=re.MULTILINE,
              )
              app, refresh_count = re.subn(
                  r'^const REFRESH_NAV_RE = .*?;$',
                  r'const REFRESH_NAV_RE = /^\\/(?:ja|en|es|pt-br)?\\/?(?:$|map\\/?$|home\\/?$|profile(?:\\/settings)?\\/?$|settings\\/?$|records\\/?$|record\\/?$)/;',
                  app,
                  count=1,
                  flags=re.MULTILINE,
              )
              if personal_count != 1 or refresh_count != 1:
                  raise SystemExit(f'PWA route targets personal={personal_count} refresh={refresh_count}')
              app_path.write_text(app, encoding='utf-8')
              changed = True

              for filename in [
                  'scripts/verify_cloudflare_production_release.sh',
                  'platform_v2/src/deployPwaVersionContract.test.ts',
                  'platform_v2/src/routes/pwa.routes.test.ts',
              ]:
                  path = Path(filename)
                  content = path.read_text(encoding='utf-8')
                  count = content.count('ikimon-app-v7')
                  if count < 1:
                      raise SystemExit(f'missing PWA version reference in {filename}')
                  path.write_text(content.replace('ikimon-app-v7', 'ikimon-app-v8'), encoding='utf-8')

          Path('.owner-home-patch-status').write_text(('changed' if changed else 'unchanged') + '\n', encoding='utf-8')
          print(f'patch_status={"changed" if changed else "unchanged"}')
          PY
          echo "status=$(cat .owner-home-patch-status)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.patch.outputs.status == 'changed'
        run: |
          npm --prefix platform_v2 ci
          npm --prefix platform_v2/cloudflare_shadow ci

      - name: Verify owner home and PWA changes
        if: steps.patch.outputs.status == 'changed'
        run: |
          npm --prefix platform_v2 run typecheck
          npm --prefix platform_v2/cloudflare_shadow run check
          npm --prefix platform_v2 exec -- tsx --test src/routes/pwa.routes.test.ts src/deployPwaVersionContract.test.ts
          npm --prefix platform_v2/cloudflare_shadow exec -- tsx --test src/ownerHomeInjectionContract.test.ts
          git diff --check

      - name: Commit verified implementation
        if: steps.patch.outputs.status == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .owner-home-patch-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_v2/cloudflare_shadow/src/index.ts \
                  platform_v2/cloudflare_shadow/src/ownerHomeInjectionContract.test.ts \
                  platform_v2/src/appInstall.ts \
                  platform_v2/src/deployPwaVersionContract.test.ts \
                  platform_v2/src/routes/pwa.routes.test.ts \
                  scripts/verify_cloudflare_production_release.sh
          git commit -m "fix: refresh and compact the real owner home"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owner-home-apply-evidence
          path: owner-home-apply-evidence
          if-no-files-found: error
          retention-days: 3

  verify-e2e-full:
    name: Verify Staging in Browser / full non-map ${{ matrix.shard_index }} of ${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    needs: [plan, verify-e2e-prepare]
    if: needs.plan.outputs.run_full_browser_e2e == 'true'
    timeout-minutes: 20
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 1
            shard_total: 2
          - shard_index: 2
            shard_total: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup platform browser smoke runtime
        uses: ./.github/actions/setup-platform-browser
        with:
          install-with-deps: "false"

      - name: Run staging browser E2E non-map shard
        timeout-minutes: 17
        working-directory: platform_v2
        shell: bash
        env:
          STAGING_BASE_URL: https://staging.ikimon.life
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
          V2_PRIVILEGED_WRITE_API_KEY: ${{ secrets.V2_PRIVILEGED_WRITE_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/planStagingNonMapShards.mjs --total=${{ matrix.shard_total }} --validate
          node scripts/planStagingNonMapShards.mjs --total=${{ matrix.shard_total }} --explain
          mapfile -t STAGING_NON_MAP_SPECS < <(node scripts/planStagingNonMapShards.mjs --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }})
          if [ "${#STAGING_NON_MAP_SPECS[@]}" -eq 0 ]; then
            echo "No staging non-map specs selected for shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
            exit 1
          fi
          {
            echo "## Staging non-map shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
            echo ""
            printf -- "- %s\n" "${STAGING_NON_MAP_SPECS[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Running staging non-map specs:\n'
          printf '  %s\n' "${STAGING_NON_MAP_SPECS[@]}"
          npx playwright test -c playwright.staging.config.ts "${STAGING_NON_MAP_SPECS[@]}"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-playwright-artifacts-full-non-map-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}
          path: |
            platform_v2/test-results
            platform_v2/playwright-report/staging
          if-no-files-found: ignore


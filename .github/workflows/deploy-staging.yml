  capture-ux-review:
    name: Capture Staging UX Review Evidence
    runs-on: ubuntu-latest
    needs: [plan, verify-ssh]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_ux_review == 'true'
    timeout-minutes: 8
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup platform browser smoke runtime

name: Diagnose Owner Identity Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-owner-identity-20260712'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform_v2/cloudflare_shadow/package-lock.json
      - working-directory: platform_v2/cloudflare_shadow
        run: npm ci
      - name: Compare authenticated identity with July observation owners
        working-directory: platform_v2/cloudflare_shadow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-identity-diagnostic
          node <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';

          const coreDb = 'ikimon_prod_core';
          const obsDb = 'ikimon_prod_observations_2026_06';
          const targetEmail = 'yamaki0102@gmail.com';
          const runD1 = (db, sql) => {
            const raw = execFileSync('npx', ['wrangler', 'd1', 'execute', db, '--remote', '--json', '--command', sql], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
            return JSON.parse(raw)[0]?.results ?? [];
          };
          const escapeSql = (value) => String(value).replaceAll("'", "''");
          const hash = (value) => createHash('sha256').update(String(value ?? '')).digest('hex').slice(0, 12);

          const accountRows = runD1(coreDb, `select user_id, last_login_at from auth_users where lower(email) = lower('${escapeSql(targetEmail)}')`);
          const oauthRows = runD1(coreDb, `select user_id, provider, linked_at from oauth_accounts where lower(coalesce(provider_email,'')) = lower('${escapeSql(targetEmail)}')`);
          const knownIds = new Set([...accountRows, ...oauthRows].map((row) => String(row.user_id)));
          const sessionColumns = new Set(runD1(coreDb, 'pragma table_info(auth_sessions)').map((row) => String(row.name)));
          let sessionRows = [];
          if (knownIds.size > 0 && sessionColumns.has('user_id')) {
            const inList = [...knownIds].map((id) => `'${escapeSql(id)}'`).join(',');
            const lastUsed = sessionColumns.has('last_used_at') ? 'last_used_at' : 'null as last_used_at';
            const expires = sessionColumns.has('expires_at') ? 'expires_at' : 'null as expires_at';
            sessionRows = runD1(coreDb, `select user_id, ${lastUsed}, ${expires} from auth_sessions where user_id in (${inList}) order by coalesce(last_used_at,'') desc limit 10`);
          }

          const ownerRows = runD1(obsDb, `select
              o.owner_user_id,
              substr(o.observed_at,1,10) as observed_date,
              count(distinct o.observation_id) as record_count,
              count(a.asset_id) as asset_count,
              sum(case when lower(coalesce(a.mime,'')) like 'image/%' then 1 else 0 end) as image_count
            from observations o
            left join asset_ledger a on a.observation_id = o.observation_id
            where substr(o.observed_at,1,10) in ('2026-07-07','2026-07-10')
            group by o.owner_user_id, substr(o.observed_at,1,10)
            order by observed_date desc, image_count desc`);

          const knownHashes = [...knownIds].map(hash);
          const owners = ownerRows.map((row) => ({
            ownerHash: hash(row.owner_user_id),
            observedDate: String(row.observed_date),
            recordCount: Number(row.record_count || 0),
            assetCount: Number(row.asset_count || 0),
            imageCount: Number(row.image_count || 0),
            matchesKnownAccount: knownIds.has(String(row.owner_user_id)),
          }));
          const report = {
            mode: 'read-only',
            exactEmailLookupPerformed: true,
            accountRowCount: accountRows.length,
            oauthRowCount: oauthRows.length,
            knownAccountHashes: knownHashes,
            knownAccountHasRecentSession: sessionRows.length > 0,
            knownSessionCount: sessionRows.length,
            owners,
            photoOwnerMatchesKnownAccount: owners.some((row) => row.imageCount > 0 && row.matchesKnownAccount),
            noteOwnerMatchesKnownAccount: owners.some((row) => row.imageCount === 0 && row.matchesKnownAccount),
            rawEmailIncluded: false,
            rawUserIdsIncluded: false,
            productionMutated: false,
          };
          writeFileSync('owner-identity-diagnostic/report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: owner-identity-diagnostic
          path: platform_v2/cloudflare_shadow/owner-identity-diagnostic
          if-no-files-found: error
          retention-days: 3
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/diagnose-owner-identity-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: remove owner identity diagnostic workflow" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

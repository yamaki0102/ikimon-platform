name: Fix Mobile Map E2E Helpers

on:
  push:
    branches:
      - agent/mobile-map-progressive-controls-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-mobile-map-e2e-helpers
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mobile-map-progressive-controls-20260712'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mobile-map-progressive-controls-20260712
          fetch-depth: 0

      - name: Apply helper correction
        run: |
          set -euo pipefail
          python ops/fix_mobile_map_e2e_helpers.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          source = Path('platform_v2/e2e/map.staging.spec.ts').read_text(encoding='utf-8')
          assert 'await installMapApiStubs(page);' not in source
          assert 'await waitForMapReady(page, "/map");' not in source
          assert 'await installMapLibreStubForSmoke(page);' in source
          assert 'await installDeterministicMapApiFixtures(page);' in source
          assert 'await waitForMapShellReady(page, "/map", true);' in source
          PY

      - name: Commit correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mobile-map-e2e-helpers.yml
          rm -f ops/fix_mobile_map_e2e_helpers.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: use existing map staging helpers'
          git push origin HEAD:agent/mobile-map-progressive-controls-20260712
